<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaderboards — kentuckymat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
  <script src="/js/analytics.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  <script src="/hs_config.js"></script>
  
  <div class="page-container">
    <header class="header">
      <h1>Leaderboards</h1>
      <div class="header-subline" id="season-info">Season 2026</div>
    </header>

    <section class="section">
      <!-- Gender Toggle -->
      <div style="margin-bottom: 1.5em;">
        <div style="display: flex; gap: 1em; align-items: center;">
          <label style="font-weight: 600; color: var(--text-main);">Gender:</label>
          <button id="gender-toggle-boys" class="gender-toggle active" data-gender="boys">Boys</button>
          <button id="gender-toggle-girls" class="gender-toggle" data-gender="girls">Girls</button>
        </div>
      </div>

      <!-- Stat Tabs -->
      <div id="stat-tabs" style="display: flex; gap: 0.5em; margin-bottom: 1.5em; border-bottom: 2px solid var(--border-light);">
        <button id="tab-wins" class="stat-tab active" data-stat="wins">Wins</button>
        <button id="tab-pins" class="stat-tab" data-stat="pins">Pins</button>
        <button id="tab-techs" class="stat-tab" data-stat="techs">Techs</button>
        <button id="tab-career-wins" class="stat-tab" data-stat="career_wins">Career Wins</button>
      </div>

      <!-- Leaderboard Table -->
      <div class="table-wrapper">
        <table id="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Team</th>
              <th>Rank</th>
              <th>W–L</th>
              <th id="stat-header">Wins</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <!-- Table rows will be generated by JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/leaderboards.js"></script>
  <script src="/footer.js"></script>
</body>
</html>
