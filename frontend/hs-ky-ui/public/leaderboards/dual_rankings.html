<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dual Rankings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/hs_config.js"></script>
  <script src="/js/analytics.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  
  <div class="page-container">
    <header class="header">
      <h1>Dual Rankings</h1>
      <div class="header-subline" id="season-info">Season 2026</div>
      <!-- Drop selector (hidden if only one drop) -->
      <div id="drop-selector-container" style="display: none; margin-top: 0.5em;">
        <label for="drop-selector" style="margin-right: 0.5em; color: var(--text-secondary);">Rankings Drop:</label>
        <select id="drop-selector" style="padding: 0.25em 0.5em; border: 1px solid var(--border-light); border-radius: 4px; background: var(--bg-card); color: var(--text-main);">
        </select>
      </div>
    </header>

    <section class="section">
      <div class="section-intro">
        <p>Theoretical dual meet standings if every team wrestled every other team. Rankings are based on wins, win percentage, and point differential. <a href="/dual_predictor.html" id="dual-predictor-link">Simulate a Dual matchup here</a>.</p>
      </div>

      <!-- Leaderboard Table -->
      <div class="table-wrapper">
        <table id="standings-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th>Record</th>
              <th>Point Diff</th>
              <th>Win %</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/leaderboards/dual_rankings.js"></script>
  <script src="/footer.js"></script>
</body>
</html>
