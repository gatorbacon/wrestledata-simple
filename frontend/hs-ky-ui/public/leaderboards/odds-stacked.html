<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <title>All-American & Title Odds (Stacked View)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/js/analytics.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  <div class="page-container">
    <header class="header">
      <h1>All-American & Title Odds (Stacked View)</h1>
      <div class="header-subline" id="season-info"></div>
      <p class="header-explainer">
        Probability of finishing Top 8 (All-American), reaching the finals, or winning the NCAA title.
      </p>
      <p class="header-explainer">
        Calculation is based on rank, MatSavant MatchIndex Score, and seed (once seeds come out).  
      </p>
    </header>

    <section class="section">
      <div id="weight-tabs-container" class="weight-tabs-container" role="tablist" aria-label="Weight class filter">
        <!-- Tabs will be inserted here by JS -->
      </div>
      <div class="stacked-odds-legend" id="stacked-odds-legend">
        <!-- Legend will be inserted here by JS -->
      </div>
      <div class="table-wrapper">
        <table id="odds-stacked-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Team</th>
              <th class="sortable" data-sort="champ_prob" id="odds-breakdown-header">
                Odds Breakdown (Cumulative Path to AA)
                <span class="tooltip-icon" data-tooltip="cumulative-path">→</span>
                <span class="sort-indicator">▲</span>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/leaderboards/odds-stacked.js"></script>
  <script src="/footer.js"></script>
</body>
</html>
