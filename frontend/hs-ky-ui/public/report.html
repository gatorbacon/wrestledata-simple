<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Report a Match or Ranking Question</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
  <script src="/js/analytics.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  <div class="page-container">
    <header class="header">
      <h1>Report a Match or Ranking Question</h1>
    </header>

    <section class="section">
      <div id="form-success" style="display: none; padding: 2em; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 4px; text-align: center;">
        <h2 style="color: var(--text-main); margin-bottom: 0.5em;">Thank You</h2>
        <p style="color: var(--text-secondary); line-height: 1.6;">
          Your submission has been received. We'll review it and get back to you if needed.
        </p>
      </div>

      <p id="form-intro" style="margin-bottom: 2em; color: var(--text-secondary); line-height: 1.6;">
        If a match result is missing from TrackWrestling, or if you have a question about a ranking, you can submit it here. Rankings are based only on recorded match data.
      </p>

      <form
        id="report-form" 
        id="report-form"
        name="report-match-or-ranking" 
        method="POST" 
        data-netlify="true" 
        netlify-honeypot="bot-field"
        style="max-width: 600px;"
      >
        <input type="hidden" name="form-name" value="report-match-or-ranking" />
        
        <!-- Honeypot field for spam protection -->
        <p style="display: none;">
          <label>Don't fill this out if you're human: <input name="bot-field" /></label>
        </p>

        <!-- Required Fields -->
        <div style="margin-bottom: 1.5em;">
          <label for="name" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Your Name <span style="color: var(--text-secondary);">(required)</span>
          </label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            required 
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <div style="margin-bottom: 1.5em;">
          <label for="wrestler-names" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Wrestler Name(s) <span style="color: var(--text-secondary);">(required)</span>
          </label>
          <input 
            type="text" 
            id="wrestler-names" 
            name="wrestler-names" 
            required 
            placeholder="e.g., John Smith or John Smith vs Jane Doe"
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <div style="margin-bottom: 1.5em;">
          <label for="schools" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            School(s) <span style="color: var(--text-secondary);">(required)</span>
          </label>
          <input 
            type="text" 
            id="schools" 
            name="schools" 
            required 
            placeholder="Enter the school of the wrestler in question"
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <!-- Optional Fields -->
        <div style="margin-bottom: 1.5em;">
          <label for="match-date" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Match Date <span style="color: var(--text-secondary); font-weight: normal;">(optional)</span>
          </label>
          <input 
            type="date" 
            id="match-date" 
            name="match-date" 
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <div style="margin-bottom: 1.5em;">
          <label for="event" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Event / Tournament <span style="color: var(--text-secondary); font-weight: normal;">(optional)</span>
          </label>
          <input 
            type="text" 
            id="event" 
            name="event" 
            placeholder="e.g., State Tournament, Regional Championship"
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <div style="margin-bottom: 1.5em;">
          <label for="result" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Result <span style="color: var(--text-secondary); font-weight: normal;">(optional)</span>
          </label>
          <input 
            type="text" 
            id="result" 
            name="result" 
            placeholder="e.g., Fall 3:45, Decision 8-3"
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <div style="margin-bottom: 1.5em;">
          <label for="message" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Message / Explanation <span style="color: var(--text-secondary); font-weight: normal;">(optional)</span>
          </label>
          <textarea 
            id="message" 
            name="message" 
            rows="5" 
            placeholder="Provide any additional details about the missing match or ranking question..."
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main); font-family: inherit; resize: vertical;"
          ></textarea>
        </div>

        <div style="margin-bottom: 1.5em;">
          <label for="email" style="display: block; margin-bottom: 0.5em; font-weight: 600; color: var(--text-main);">
            Your Email <span style="color: var(--text-secondary); font-weight: normal;">(optional, for follow-up)</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your.email@example.com"
            style="width: 100%; padding: 0.75em; border: 1px solid var(--border-light); border-radius: 4px; font-size: 1em; background: var(--bg-card); color: var(--text-main);"
          />
        </div>

        <button 
          type="submit" 
          style="padding: 0.875em 2em; background: var(--accent-primary); color: white; border: none; border-radius: 4px; font-size: 1em; font-weight: 600; cursor: pointer; transition: background 0.2s;"
          onmouseover="this.style.background='var(--accent-primary-hover)'"
          onmouseout="this.style.background='var(--accent-primary)'"
        >
          Submit
        </button>
      </form>
    </section>
  </div>
  <script src="/footer.js"></script>
  <script>
    // Check if form was submitted successfully (Netlify redirects with ?success=true)
    if (window.location.search.includes('success=true')) {
      const successDiv = document.getElementById('form-success');
      const introP = document.getElementById('form-intro');
      const form = document.getElementById('report-form');
      if (successDiv && introP && form) {
        successDiv.style.display = 'block';
        introP.style.display = 'none';
        form.style.display = 'none';
      }
    }
  </script>
</body>
</html>
