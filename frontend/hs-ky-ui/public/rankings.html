<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rankings — WrestleData</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  <div class="page-container">
    <header class="header">
      <h1 id="rankings-title">Rankings</h1>
      <div class="header-subline" id="season-info">Season 2026</div>
    </header>

    <section class="section">
      <!-- Weight tabs (generated dynamically by rankings.js) -->
      <div class="weight-tabs" id="weight-tabs">
        <!-- Tabs will be generated by JavaScript -->
      </div>

      <div class="table-wrapper">
        <table id="rankings-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Team</th>
              <th>W–L</th>
              <th>Bonus %</th>
              <th class="col-mv">TPAR</th>
              <th>TPAR Rank</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/hs_config.js"></script>
  <script src="/rankings.js"></script>
</body>
</html>
