<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rankings — WrestleData</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Google AdSense -->
  <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6991551662268186"
      crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
  <script src="/js/analytics.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  <div class="page-container">
    <header class="header">
      <h1 id="rankings-title">Rankings</h1>
      <div class="header-subline" id="season-info">Season 2026</div>
      <!-- Drop selector (hidden if only one drop) -->
      <div id="drop-selector-container" style="display: none; margin-top: 0.5em;">
        <label for="drop-selector" style="margin-right: 0.5em; color: var(--text-secondary);">Rankings Drop:</label>
        <select id="drop-selector" style="padding: 0.25em 0.5em; border: 1px solid var(--border-light); border-radius: 4px; background: var(--bg-card); color: var(--text-main);">
        </select>
      </div>
      <!-- PDF Download Link (hidden if PDF not available) -->
      <div id="pdf-download-container" style="display: none; margin-top: 0.5em;">
        <a id="pdf-download-link" href="#" style="display: inline-flex; align-items: center; padding: 0.5em 1em; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 4px; color: var(--text-main); text-decoration: none; font-size: 0.9em;">
          <span style="margin-right: 0.5em;">📄</span>
          <span>Download Rankings PDF</span>
        </a>
      </div>
    </header>

    <section class="section">
      <!-- Weight tabs (generated dynamically by rankings.js) -->
      <div class="weight-tabs" id="weight-tabs">
        <!-- Tabs will be generated by JavaScript -->
      </div>

      <!-- Notes container (rendered from per-weight notes.md) -->
      <div id="rankings-notes" style="display: none; margin-bottom: 1.5em; padding: 1em; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 4px; color: var(--text-main);">
      </div>

      <!-- AdSense ad block commented out until approved (verification script in head remains)
      <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-6991551662268186"
             data-ad-slot="3015253830"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>
      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
      -->

      <div class="table-wrapper">
        <table id="rankings-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th class="movement-col"></th>
              <th>Name</th>
              <th>Team</th>
              <th class="grade-col">Grade</th>
              <th>Region</th>
              <th>W–L</th>
              <th>Bonus %</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/hs_config.js"></script>
  <script src="/rankings.js"></script>
  <script src="/footer.js"></script>
</body>
</html>
