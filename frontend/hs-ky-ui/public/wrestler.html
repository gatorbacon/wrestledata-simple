<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <!--EDGE:HEAD:START-->
  <title>Wrestler Profile | KentuckyMat</title>
  <meta name="description" content="Wrestler profile, match history, and career record on KentuckyMat — Kentucky high school wrestling rankings and data." />
  <link rel="canonical" href="https://www.kentuckymat.com/wrestler.html" />
  <meta property="og:title" content="Wrestler Profile | KentuckyMat" />
  <meta property="og:description" content="Wrestler profile, match history, and career record on KentuckyMat — Kentucky high school wrestling rankings and data." />
  <meta property="og:url" content="https://www.kentuckymat.com/wrestler.html" />
  <meta property="og:site_name" content="KentuckyMat" />
  <meta property="og:type" content="profile" />
  <meta property="og:image" content="https://www.kentuckymat.com/images/og-kentuckymat.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <!--EDGE:HEAD:END-->
  <!-- Google AdSense -->
  <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6991551662268186"
      crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
  <script src="/js/analytics.js"></script>
</head>

<body>
  <script src="/header.js"></script>
  <div class="page-container">
    <header class="header">
      <h1 id="wrestler-name"></h1>
      <div class="header-subline" id="wrestler-tagline"></div>
      <div class="header-meta" id="wrestler-meta"></div>
    </header>

    <!-- PROFILE SUMMARY GRID: MV (left) • Timeline (center) • Skill (right) -->
    <section class="profile-summary-grid" style="display:none;">
      <!-- Left: Match Index Summary -->
      <div class="profile-summary-col profile-summary-col--mv">
        <div class="profile-section profile-section--mv" id="mv-section">
          <!-- MV content will be rendered here by JS -->
        </div>
      </div>

      <!-- Center: TPAR Impact Timeline (visual anchor) -->
      <div class="profile-summary-col profile-summary-col--timeline">
        <section class="section section--timeline" id="match-impact-section">
          <div class="section-header">
            <h2>TPAR Impact Timeline</h2>
          </div>
          <div class="section-divider"></div>
          <!-- xTP toggle removed - chart is MV-only -->
          <div class="match-impact-chart-container" id="match-impact-chart-container">
            <!-- Chart will be rendered here -->
          </div>
          <div class="match-impact-labels">
            <span class="match-impact-label">Bars: Per-match TPAR impact</span>
            <span class="match-impact-label">Line: Season average TPAR</span>
        </div>
        </section>
      </div>

      <!-- Right: Skill Profile -->
      <div class="profile-summary-col profile-summary-col--skill">
        <div class="profile-section profile-section--skill" id="skill-section">
          <!-- Skill Profile content will be rendered here by JS -->
        </div>
      </div>
    </section>

    <!-- MV CONTEXT (COMPRESSED, BELOW TIMELINE) -->
    <section class="section" id="mv-context-section">
      <div class="mv-context-compressed" id="mv-context-compressed">
        <!-- Context will be rendered here by JS -->
      </div>
    </section>

    <!-- AdSense ad block commented out until approved (verification script in head remains)
    <div class="ad-container" id="wrestler-ad-container">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-6991551662268186"
           data-ad-slot="9357300909"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
    -->

    <!-- MATCH HISTORY -->
    <section class="section section--match-history">
      <h2>Match History</h2>
      <div class="table-wrapper">
        <table id="match-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>Weight</th>
              <th>Opponent Team</th>
              <th>Opponent Rank</th>
              <th>Result</th>
              <th class="mi-impact-header">MI Impact</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="match-data-note" class="system-notice" style="display: none;" role="status"></div>
    </section>
  </div>

  <script src="/hs_config.js"></script>
  <script src="/app.js"></script>
  <script src="/tooltips.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const careerId = params.get("career_id");
      const wrestlerId = params.get("id");

      if (careerId) {
        loadCareerProfile(careerId);
        return;
      }

      if (!wrestlerId) {
        document.getElementById("wrestler-name").textContent = "No wrestler selected";
        document.getElementById("wrestler-meta").textContent = "Use ?id=<wrestler_id>&gender=<boys|girls> or ?career_id=<career_id>&gender=<boys|girls>";
        return;
      }

      loadWrestlerProfile(wrestlerId);
    });
    </script>
  <script src="/footer.js"></script>
</body>
</html>
