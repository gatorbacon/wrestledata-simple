<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rankings — MatSavant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260921" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
  <style>
    .sort-by-row {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto 14px;
      padding: 0 16px;
    }
    .sort-by-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }
    .sort-pill {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .sort-pill:hover {
      color: var(--text);
    }
    .sort-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .sort-subtext {
      max-width: 1100px;
      margin: 0 auto 12px;
      padding: 0 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <script src="/analytics.js?v=20260911"></script>
  <script src="/header.js?v=20260908"></script>
  <div class="page-container">
    <header class="header">
      <h1 id="rankings-title">2027 Rankings</h1>
      <div class="header-subline" id="season-info"></div>
    </header>

    <!-- Same P4P / weight-class widget as the homepage's "2027 Rankings"
         section (same data, same p4p_rankings.js) -- shows however many
         spots the current FloWrestling snapshot actually publishes per
         weight (20/24/33/whatever that week), never padded out further.
         Sort pills + contextual subtext below are page-specific -- the
         homepage widget keeps its own dropdown/def-chip untouched. -->
    <section class="section" id="p4p-section">
      <div class="sort-by-row">
        <span class="sort-by-label">Sort by:</span>
        <button type="button" class="sort-pill active" data-sort="rank">Ranking</button>
        <button type="button" class="sort-pill" data-sort="dpg">DPG</button>
      </div>
      <div class="dpg-pill-rail">
        <div class="hp-panel-tabs" id="p4p-weight-tabs">
          <button class="hp-tab active" data-weight="p4p">P4P</button>
          <button class="hp-tab" data-weight="125">125</button>
          <button class="hp-tab" data-weight="133">133</button>
          <button class="hp-tab" data-weight="141">141</button>
          <button class="hp-tab" data-weight="149">149</button>
          <button class="hp-tab" data-weight="157">157</button>
          <button class="hp-tab" data-weight="165">165</button>
          <button class="hp-tab" data-weight="174">174</button>
          <button class="hp-tab" data-weight="184">184</button>
          <button class="hp-tab" data-weight="197">197</button>
          <button class="hp-tab" data-weight="285">285</button>
        </div>
      </div>
      <p class="sort-subtext" id="sort-subtext"></p>
      <div class="table-wrapper" id="p4p-table-wrapper">
        <table id="p4p-table" class="dpg-table">
          <thead>
            <tr>
              <th style="width: 32px;">Rank</th>
              <th>Wrestler</th>
              <th>Team</th>
              <th class="num" title="Dual Points Gained. Your dual-point result (DEC 3, MD 4, TF 5, F 6) minus what a typical wrestler gets against that same opponent.">DPG ⓘ</th>
              <th class="num">Bonus %</th>
              <th class="num">Pin %</th>
              <th>Record</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="dpg-mobile-list" id="p4p-mobile-list"></div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/mobile_rank_row.js?v=20260907"></script>
  <script src="/p4p_rankings.js?v=20260911"></script>
</body>
</html>
