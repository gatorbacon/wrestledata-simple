<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wrestler DPG Chart — MatSavant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260921" />
  <style>
    .wv-header { text-align: center; margin-bottom: 32px; }
    .rv-key { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: -14px auto 24px; font-size: 0.8rem; color: var(--muted); }
    .rv-key-item { display: flex; align-items: center; gap: 6px; }
    .rv-key-swatch { display: inline-block; width: 18px; height: 12px; border-radius: 3px; flex-shrink: 0; background: rgba(93,156,219,0.28); border: 1px solid #3f6ea5; }
    .rv-key-swatch--champ { height: 0; border: none; border-top: 2px dashed #16325c; }
    .wv-search { max-width: 420px; margin: 0 auto 28px; position: relative; }
    .wv-search input {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); font-size: 0.9rem; box-sizing: border-box;
    }
    .wv-suggestions {
      position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      max-height: 320px; overflow-y: auto; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: none;
    }
    .wv-suggestions.visible { display: block; }
    .wv-suggestion {
      padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .wv-suggestion:last-child { border-bottom: none; }
    .wv-suggestion:hover, .wv-suggestion.highlighted { background: var(--panel-2); }
    .wv-suggestion .name { font-weight: 700; color: var(--text); font-size: 0.9rem; }
    .wv-suggestion .meta { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .wv-suggestion .rank { font-size: 0.75rem; font-weight: 800; color: var(--accent); }
    .wv-no-results { padding: 12px; text-align: center; color: var(--muted); font-size: 0.85rem; }

    .wv-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 14px);
      padding: 24px 28px 20px;
      margin-bottom: 24px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
    .wv-card-head { display: flex; align-items: flex-start; gap: 16px; }
    .wv-photo {
      width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
      background: var(--panel-2); border: 1px solid var(--border); flex-shrink: 0;
    }
    .wv-name-block { flex: 1; min-width: 0; }
    .wv-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .wv-name { font-size: 1.35rem; font-weight: 800; color: var(--text); }
    .wv-weight-badge {
      font-size: 0.9rem; font-weight: 800; padding: 3px 12px; border-radius: 999px; line-height: 1.4;
      background: var(--panel-2); color: var(--text);
    }
    .wv-meta { font-size: 0.86rem; color: var(--muted); margin-top: 3px; }
    .wv-stat { text-align: center; padding: 0 18px; flex-shrink: 0; }
    .wv-stat .label { font-size: 0.78rem; color: var(--muted); }
    .wv-stat .value { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-top: 2px; }

    .wv-caption {
      text-align: center; font-size: 0.82rem; color: var(--muted); font-style: italic;
      margin: 18px 0 4px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .wv-chart-wrap { width: 100%; }
    .wv-chart-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .wv-chart-wrap svg circle[data-tooltip] { cursor: pointer; }

    .wv-card-legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 8px; font-size: 0.82rem; color: var(--text); font-weight: 600; }
    .wv-card-legend .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

    .wv-empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .wv-loading { text-align: center; color: var(--muted); padding: 60px 20px; }

    .rv-tooltip {
      position: fixed; z-index: 1000; pointer-events: none;
      background: #211c16; color: #f5f1e8; border-radius: 8px;
      padding: 10px 13px; font-size: 0.8rem; line-height: 1.5;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0; transform: translateY(4px); transition: opacity 0.1s ease, transform 0.1s ease;
      max-width: 220px;
    }
    .rv-tooltip.visible { opacity: 1; transform: translateY(0); }
    .rv-tooltip .tt-head { font-weight: 800; margin-bottom: 4px; color: #fff; }
    .rv-tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; }
    .rv-tooltip .tt-row .tt-label { color: #b8ae9c; }
    .rv-tooltip .tt-row .tt-value { font-weight: 700; }
  </style>
</head>
<body>
  <script src="/analytics.js?v=20260911"></script>
  <script src="/header.js?v=20260908"></script>

  <div class="page-container">
    <div class="wv-header">
      <h1 id="wv-title">Wrestler DPG Chart</h1>
      <p id="wv-subtitle" style="color:var(--muted); margin-top:6px;">Career DPG by season, across every school</p>
    </div>

    <div class="rv-key">
      <span class="rv-key-item"><span class="rv-key-swatch"></span>AA Range — 25th–75th pct. DPG among All-Americans, last 5 seasons</span>
      <span class="rv-key-item"><span class="rv-key-swatch rv-key-swatch--champ"></span>Champion avg. DPG</span>
    </div>

    <div class="wv-search">
      <input id="wv-search-input" type="text" placeholder="Start typing a wrestler's name…" autocomplete="off" />
      <div class="wv-suggestions" id="wv-suggestions"></div>
    </div>

    <div id="wv-body"><div class="wv-loading">Loading…</div></div>
  </div>

  <script src="/reports/shared/chart.js?v=20260921"></script>
  <script>
(function () {
  'use strict';
  const C = window.WrestlerChart;

  // AA-range band + champion line -- fetched once, reused for every chart
  // on this page (not weight- or wrestler-specific).
  const bandPromise = fetch('/data/reports/aa_dpg_band.json').then(r => r.ok ? r.json() : null).catch(() => null);

  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function fmt(v) {
    return v === null || v === undefined ? '—' : v.toFixed(2);
  }

  function render(wrestler, colorMap, band) {
    document.getElementById('wv-title').textContent = wrestler.name || 'Wrestler DPG Chart';
    document.getElementById('wv-search-input').value = wrestler.name || '';
    const path = (wrestler.school_path || []).join(' → ');
    document.getElementById('wv-subtitle').textContent = path || 'Career DPG by season';

    const qualifying = C.qualifyingSeasons(wrestler);
    const careerAvg = C.matchWeightedAvg(qualifying);
    const lastSeason = wrestler.seasons[wrestler.seasons.length - 1];
    const badgeColor = C.colorFor(lastSeason.team_slug, colorMap);

    const photo = wrestler.photo_url
      ? `<img class="wv-photo" src="${C.esc(wrestler.photo_url)}" alt="${C.esc(wrestler.name)}" onerror="this.style.visibility='hidden'">`
      : `<div class="wv-photo"></div>`;

    const legendSchools = [];
    wrestler.seasons.forEach(s => {
      if (!legendSchools.some(l => l.slug === s.team_slug)) {
        legendSchools.push({ slug: s.team_slug, name: s.team });
      }
    });
    const legendHtml = legendSchools.map(l => {
      const c = C.colorFor(l.slug, colorMap);
      return `<span><span class="dot" style="background:${C.hexToRgba(c.hex, 0.85)}${c.stroke ? ';border:1.5px solid #211c16' : ''}"></span>${C.esc(l.name)}</span>`;
    }).join('');

    const body = document.getElementById('wv-body');
    const card = document.createElement('div');
    card.className = 'wv-card';
    card.innerHTML = `
      <div class="wv-card-head">
        ${photo}
        <div class="wv-name-block">
          <div class="wv-name-row">
            <span class="wv-name">${C.esc(wrestler.name || 'Unknown')}</span>
            ${wrestler.weight_class ? `<span class="wv-weight-badge" style="background:${C.hexToRgba(badgeColor.hex, 0.85)}; color:${C.textColorFor(badgeColor.hex)}">${wrestler.weight_class}</span>` : ''}
          </div>
          <div class="wv-meta">${C.esc(path)}</div>
        </div>
        <div class="wv-stat"><div class="label">Career DPG</div><div class="value">${fmt(careerAvg)}</div></div>
      </div>
      <div class="wv-caption">match-weighted &middot; n&lt;6 seasons shown hollow, marked *, excluded from the average</div>
      <div class="wv-chart-wrap"></div>
      <div class="wv-card-legend">${legendHtml}</div>
    `;
    body.innerHTML = '';
    body.appendChild(card);
    card.querySelector('.wv-chart-wrap').innerHTML = C.buildChartSVG(wrestler, colorMap, band);
    C.wireTooltips(card.querySelector('.wv-chart-wrap'));
  }

  function load(id) {
    const body = document.getElementById('wv-body');
    body.innerHTML = '<div class="wv-loading">Loading…</div>';
    Promise.all([
      fetch(`/data/reports/wrestler_view/${id}.json`).then(r => { if (!r.ok) throw new Error('not found'); return r.json(); }),
      fetch('/data/team_colors.json').then(r => r.ok ? r.json() : { teams: {}, default: C.DEFAULT_COLOR }).catch(() => ({ teams: {}, default: C.DEFAULT_COLOR })),
      bandPromise,
    ])
      .then(([data, colorMap, band]) => render(data, colorMap, band))
      .catch(() => {
        body.innerHTML = `<div class="wv-empty">No wrestler view found. Try searching for the name above again.</div>`;
      });
  }

  function selectWrestler(careerId) {
    const url = new URL(window.location);
    url.searchParams.set('id', careerId);
    window.history.pushState({}, '', url);
    load(careerId);
  }

  // ---- name autocomplete (same wrestler_index.json + substring-filter
  // pattern as the reports hub's own Wrestler Search tab) ----
  let wrestlerIndex = [];
  fetch('/data/reports/wrestler_index.json').then(r => r.json()).then(data => {
    wrestlerIndex = data;
  }).catch(() => {});

  const input = document.getElementById('wv-search-input');
  const box = document.getElementById('wv-suggestions');
  let highlighted = -1;

  function renderSuggestions(matches) {
    if (!matches.length) {
      box.innerHTML = '<div class="wv-no-results">No matches</div>';
      box.classList.add('visible');
      return;
    }
    box.innerHTML = matches.map((w, i) => `
      <div class="wv-suggestion" data-idx="${i}" data-id="${C.esc(w.career_id)}">
        <div>
          <div class="name">${C.esc(w.name)}</div>
          <div class="meta">${C.esc(w.team || '')}${w.weight_class ? ' · ' + w.weight_class : ''} · ${C.esc(w.latest_year)}</div>
        </div>
        <div class="rank">${w.latest_rank ? '#' + w.latest_rank : 'NR'}</div>
      </div>
    `).join('');
    box.classList.add('visible');
    highlighted = -1;
    box.querySelectorAll('.wv-suggestion').forEach(el => {
      el.addEventListener('click', () => {
        box.classList.remove('visible');
        selectWrestler(el.dataset.id);
      });
    });
  }

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q || !wrestlerIndex.length) {
      box.classList.remove('visible');
      return;
    }
    const matches = wrestlerIndex
      .filter(w => w.name && w.name.toLowerCase().includes(q))
      .sort((a, b) => (a.latest_rank || Infinity) - (b.latest_rank || Infinity))
      .slice(0, 10);
    renderSuggestions(matches);
  });

  input.addEventListener('keydown', (e) => {
    const items = box.querySelectorAll('.wv-suggestion');
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlighted = Math.min(highlighted + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('highlighted', i === highlighted));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlighted = Math.max(highlighted - 1, 0);
      items.forEach((el, i) => el.classList.toggle('highlighted', i === highlighted));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const target = highlighted >= 0 ? items[highlighted] : items[0];
      if (target) { box.classList.remove('visible'); selectWrestler(target.dataset.id); }
    } else if (e.key === 'Escape') {
      box.classList.remove('visible');
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.wv-search')) box.classList.remove('visible');
  });

  const id = qs('id');
  if (id) {
    load(id);
  } else {
    document.getElementById('wv-body').innerHTML =
      '<div class="wv-empty">Search for a wrestler by name above.</div>';
  }
})();
  </script>
</body>
</html>
