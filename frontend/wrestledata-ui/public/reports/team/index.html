<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Team Roster DPG — MatSavant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260921" />
  <style>
    .tr-header { text-align: center; margin-bottom: 24px; }
    .tr-header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .rv-key { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 0 auto 20px; font-size: 0.8rem; color: var(--muted); }
    .rv-key-item { display: flex; align-items: center; gap: 6px; }
    .rv-key-swatch { display: inline-block; width: 18px; height: 12px; border-radius: 3px; flex-shrink: 0; background: rgba(93,156,219,0.28); border: 1px solid #3f6ea5; }
    .rv-key-swatch--champ { height: 0; border: none; border-top: 2px dashed #16325c; }

    .tr-controls {
      max-width: 640px; margin: 0 auto 28px; background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r-md, 14px); padding: 16px 20px;
    }
    .tr-controls-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .tr-field { flex: 1; min-width: 140px; }
    .tr-field label {
      display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px;
    }
    .tr-field select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.92rem; box-sizing: border-box;
    }
    .tr-go-btn {
      padding: 11px 20px; border-radius: 8px; border: none; background: var(--accent);
      color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    }

    .tr-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 14px);
      padding: 20px 24px 16px;
      margin-bottom: 20px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
    .tr-card-head { display: flex; align-items: flex-start; gap: 14px; }
    .tr-photo {
      width: 50px; height: 50px; border-radius: 50%; object-fit: cover;
      background: var(--panel-2); border: 1px solid var(--border); flex-shrink: 0;
    }
    .tr-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tr-name { font-size: 1.15rem; font-weight: 800; color: var(--text); text-decoration: none; }
    .tr-name:hover { text-decoration: underline; }
    .tr-weight-badge {
      font-size: 0.82rem; font-weight: 800; padding: 2px 10px; border-radius: 999px;
      background: var(--panel-2); color: var(--text);
    }
    .tr-meta { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .tr-stat { text-align: center; padding: 0 14px; flex-shrink: 0; }
    .tr-stat .label { font-size: 0.72rem; color: var(--muted); }
    .tr-stat .value { font-size: 1.25rem; font-weight: 800; color: var(--text); margin-top: 2px; }

    .tr-chart-wrap { width: 100%; margin-top: 10px; }
    .tr-chart-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .tr-chart-wrap svg circle[data-tooltip] { cursor: pointer; }

    .tr-empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .tr-loading { text-align: center; color: var(--muted); padding: 60px 20px; }

    .rv-tooltip {
      position: fixed; z-index: 1000; pointer-events: none;
      background: #211c16; color: #f5f1e8; border-radius: 8px;
      padding: 10px 13px; font-size: 0.8rem; line-height: 1.5;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0; transform: translateY(4px); transition: opacity 0.1s ease, transform 0.1s ease;
      max-width: 220px;
    }
    .rv-tooltip.visible { opacity: 1; transform: translateY(0); }
    .rv-tooltip .tt-head { font-weight: 800; margin-bottom: 4px; color: #fff; }
    .rv-tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; }
    .rv-tooltip .tt-row .tt-label { color: #b8ae9c; }
    .rv-tooltip .tt-row .tt-value { font-weight: 700; }
  </style>
</head>
<body>
  <script src="/analytics.js?v=20260911"></script>
  <script src="/header.js?v=20260908"></script>

  <div class="page-container">
    <div class="tr-header">
      <h1 id="tr-title">Team Roster DPG</h1>
      <p id="tr-subtitle">&nbsp;</p>
    </div>

    <div class="rv-key">
      <span class="rv-key-item"><span class="rv-key-swatch"></span>AA Range — 25th–75th pct. DPG among All-Americans, last 5 seasons</span>
      <span class="rv-key-item"><span class="rv-key-swatch rv-key-swatch--champ"></span>Champion avg. DPG</span>
    </div>

    <div class="tr-controls">
      <div class="tr-controls-row">
        <div class="tr-field">
          <label for="tr-team-select">Team</label>
          <select id="tr-team-select"></select>
        </div>
        <div class="tr-field">
          <label for="tr-year-select">Season</label>
          <select id="tr-year-select"></select>
        </div>
        <button class="tr-go-btn" id="tr-go">View</button>
      </div>
    </div>

    <div id="tr-body"><div class="tr-loading">Loading…</div></div>
  </div>

  <script src="/reports/shared/chart.js?v=20260921"></script>
  <script>
(function () {
  'use strict';
  const C = window.WrestlerChart;

  // AA-range band + champion line -- fetched once, reused for every chart
  // on this page (not weight- or wrestler-specific).
  const bandPromise = fetch('/data/reports/aa_dpg_band.json').then(r => r.ok ? r.json() : null).catch(() => null);

  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function fmt(v) {
    return v === null || v === undefined ? '—' : v.toFixed(2);
  }

  function renderCard(wrestler, colorMap, band) {
    const qualifying = C.qualifyingSeasons(wrestler);
    const careerAvg = C.matchWeightedAvg(qualifying);
    const lastSeason = wrestler.seasons[wrestler.seasons.length - 1];
    const badgeColor = C.colorFor(lastSeason.team_slug, colorMap);
    const path = (wrestler.school_path || []).join(' → ');

    const photo = wrestler.photo_url
      ? `<img class="tr-photo" src="${C.esc(wrestler.photo_url)}" alt="${C.esc(wrestler.name)}" onerror="this.style.visibility='hidden'">`
      : `<div class="tr-photo"></div>`;

    const card = document.createElement('div');
    card.className = 'tr-card';
    card.innerHTML = `
      <div class="tr-card-head">
        ${photo}
        <div style="flex:1; min-width:0;">
          <div class="tr-name-row">
            <a class="tr-name" href="/wrestler.html?id=${encodeURIComponent(wrestler.wrestler_id)}">${C.esc(wrestler.name || 'Unknown')}</a>
            ${wrestler.weight_class ? `<span class="tr-weight-badge" style="background:${C.hexToRgba(badgeColor.hex, 0.85)}; color:${C.textColorFor(badgeColor.hex)}">${wrestler.weight_class}</span>` : ''}
          </div>
          <div class="tr-meta">${C.esc(path)}</div>
        </div>
        <div class="tr-stat"><div class="label">Career DPG</div><div class="value">${fmt(careerAvg)}</div></div>
      </div>
      <div class="tr-chart-wrap"></div>
    `;
    document.getElementById('tr-body').appendChild(card);
    card.querySelector('.tr-chart-wrap').innerHTML = C.buildChartSVG(wrestler, colorMap, band);
    C.wireTooltips(card.querySelector('.tr-chart-wrap'));
  }

  function render(data, colorMap, band) {
    document.getElementById('tr-title').textContent = `${data.team_name} — ${data.year} Roster`;
    document.getElementById('tr-subtitle').textContent =
      `${data.roster.length} wrestler(s) · full career DPG shown for each`;

    const body = document.getElementById('tr-body');
    body.innerHTML = '';
    if (!data.roster.length) {
      body.innerHTML = `<div class="tr-empty">No roster data found.</div>`;
      return;
    }
    data.roster.forEach(w => renderCard(w, colorMap, band));
  }

  const MIN_YEAR = 2012, MAX_YEAR = 2026;

  function loadReport(team, year) {
    const body = document.getElementById('tr-body');
    body.innerHTML = '<div class="tr-loading">Loading…</div>';
    Promise.all([
      fetch(`/data/reports/team_roster/${team}_${year}.json`).then(r => { if (!r.ok) throw new Error('not found'); return r.json(); }),
      fetch('/data/team_colors.json').then(r => r.ok ? r.json() : { teams: {}, default: C.DEFAULT_COLOR }).catch(() => ({ teams: {}, default: C.DEFAULT_COLOR })),
      bandPromise,
    ])
      .then(([data, colorMap, band]) => render(data, colorMap, band))
      .catch(() => {
        body.innerHTML = `<div class="tr-empty">No roster view found for ${C.esc(team)} in ${C.esc(year)}.</div>`;
      });
  }

  const yearSelect = document.getElementById('tr-year-select');
  yearSelect.innerHTML = Array.from({ length: MAX_YEAR - MIN_YEAR + 1 }, (_, i) => MAX_YEAR - i)
    .map(y => `<option value="${y}">${y}</option>`).join('');

  const initialTeam = qs('team');
  const initialYear = qs('year') || String(MAX_YEAR);

  fetch('/data/team_colors.json').then(r => r.json()).then(colorMap => {
    const teams = Object.entries(colorMap.teams || {})
      .map(([slug, t]) => ({ slug, name: t.name }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const teamSelect = document.getElementById('tr-team-select');
    teamSelect.innerHTML = teams.map(t => `<option value="${t.slug}">${t.name}</option>`).join('');
    if (initialTeam) teamSelect.value = initialTeam;
    yearSelect.value = initialYear;

    document.getElementById('tr-go').addEventListener('click', () => {
      const team = teamSelect.value;
      const year = yearSelect.value;
      if (!team) return;
      const url = new URL(window.location);
      url.searchParams.set('team', team);
      url.searchParams.set('year', year);
      window.history.pushState({}, '', url);
      loadReport(team, year);
    });

    if (initialTeam) {
      loadReport(initialTeam, initialYear);
    } else {
      document.getElementById('tr-body').innerHTML =
        '<div class="tr-empty">Pick a team and season above, then click View.</div>';
    }
  }).catch(() => {
    document.getElementById('tr-body').innerHTML =
      '<div class="tr-empty">Team list unavailable.</div>';
  });
})();
  </script>
</body>
</html>
