<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Transfer DPG Report — MatSavant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260921" />
  <style>
    .xfer-header { text-align: center; margin-bottom: 24px; }
    .xfer-header h1 { font-size: 2rem; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .xfer-header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }
    .xfer-summary { display: flex; gap: 24px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .xfer-summary .stat { text-align: center; }
    .xfer-summary .stat .n { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .xfer-summary .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }

    .rv-key { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 16px auto 0; font-size: 0.8rem; color: var(--muted); }
    .rv-key-item { display: flex; align-items: center; gap: 6px; }
    .rv-key-swatch { display: inline-block; width: 18px; height: 12px; border-radius: 3px; flex-shrink: 0; background: rgba(93,156,219,0.28); border: 1px solid #3f6ea5; }
    .rv-key-swatch--champ { height: 0; border: none; border-top: 2px dashed #16325c; }

    .xfer-controls {
      max-width: 720px; margin: 0 auto 28px; background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r-md, 14px); padding: 16px 20px;
    }
    .xfer-controls-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .xfer-field { flex: 1; min-width: 120px; }
    .xfer-field label {
      display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px;
    }
    .xfer-field select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.92rem; box-sizing: border-box;
    }
    .xfer-go-btn {
      padding: 11px 20px; border-radius: 8px; border: none; background: var(--accent);
      color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    }

    .xfer-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 14px);
      padding: 24px 28px 20px;
      margin-bottom: 24px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    .xfer-card-head { display: flex; align-items: flex-start; gap: 16px; }
    .xfer-photo {
      width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
      background: var(--panel-2); border: 1px solid var(--border); flex-shrink: 0;
    }
    .xfer-name-block { flex: 1; min-width: 0; }
    .xfer-name-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .xfer-name { font-size: 1.35rem; font-weight: 800; color: var(--text); text-decoration: none; }
    .xfer-name:hover { text-decoration: underline; }
    .xfer-weight-badge {
      font-size: 0.9rem; font-weight: 800; padding: 3px 12px; border-radius: 999px; line-height: 1.4;
    }
    .xfer-meta { font-size: 0.86rem; color: var(--muted); margin-top: 3px; }
    .xfer-badge {
      display: inline-block; margin-top: 10px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    }
    .xfer-badge--in { background: rgba(43,108,176,0.12); color: var(--accent); }
    .xfer-badge--out { background: rgba(197,48,48,0.10); color: var(--bad); }
    .xfer-badge--both { background: rgba(138,111,174,0.14); color: #8a6fae; }

    .xfer-stats { display: flex; align-items: flex-start; gap: 0; flex-shrink: 0; }
    .xfer-stat { text-align: center; padding: 0 18px; border-left: 1px solid var(--border); }
    .xfer-stat:first-child { border-left: none; }
    .xfer-stat .label { font-size: 0.78rem; color: var(--muted); }
    .xfer-stat .value { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-top: 2px; }
    .xfer-stat--delta .value { color: var(--accent); }

    .xfer-caption {
      text-align: center; font-size: 0.82rem; color: var(--muted); font-style: italic;
      margin: 18px 0 4px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .xfer-chart-wrap { width: 100%; }
    .xfer-chart-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }

    .xfer-card-legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 8px; font-size: 0.82rem; color: var(--text); font-weight: 600; }
    .xfer-card-legend .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

    .xfer-empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .xfer-loading { text-align: center; color: var(--muted); padding: 60px 20px; }

    .xfer-chart-wrap svg circle[data-tooltip] { cursor: pointer; }
    .rv-tooltip {
      position: fixed; z-index: 1000; pointer-events: none;
      background: #211c16; color: #f5f1e8; border-radius: 8px;
      padding: 10px 13px; font-size: 0.8rem; line-height: 1.5;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      opacity: 0; transform: translateY(4px); transition: opacity 0.1s ease, transform 0.1s ease;
      max-width: 220px;
    }
    .rv-tooltip.visible { opacity: 1; transform: translateY(0); }
    .rv-tooltip .tt-head { font-weight: 800; margin-bottom: 4px; color: #fff; }
    .rv-tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; }
    .rv-tooltip .tt-row .tt-label { color: #b8ae9c; }
    .rv-tooltip .tt-row .tt-value { font-weight: 700; }

    @media (max-width: 760px) {
      .xfer-card-head { flex-wrap: wrap; }
      .xfer-stats { width: 100%; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
      .xfer-stat { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <script src="/header.js?v=20260908"></script>

  <div class="page-container">
    <div class="xfer-header">
      <h1 id="xfer-title">Transfer DPG Report</h1>
      <p id="xfer-subtitle">&nbsp;</p>
      <div class="xfer-summary" id="xfer-summary"></div>
      <div class="rv-key">
        <span class="rv-key-item"><span class="rv-key-swatch"></span>AA Range — 25th–75th pct. DPG among All-Americans, last 5 seasons</span>
        <span class="rv-key-item"><span class="rv-key-swatch rv-key-swatch--champ"></span>Champion avg. DPG</span>
      </div>
    </div>

    <div class="xfer-controls">
      <div class="xfer-controls-row">
        <div class="xfer-field">
          <label for="xfer-team-select">Team</label>
          <select id="xfer-team-select"></select>
        </div>
        <div class="xfer-field">
          <label for="xfer-start-select">Start year</label>
          <select id="xfer-start-select"></select>
        </div>
        <div class="xfer-field">
          <label for="xfer-end-select">End year</label>
          <select id="xfer-end-select"></select>
        </div>
        <button class="xfer-go-btn" id="xfer-go">View</button>
      </div>
    </div>

    <div id="xfer-body"><div class="xfer-loading">Loading…</div></div>
  </div>

  <script src="/reports/shared/chart.js?v=20260921"></script>
  <script>
(function () {
  'use strict';
  const C = window.WrestlerChart;
  const QUALIFY_MIN_MATCHES = C.QUALIFY_MIN_MATCHES;

  // AA-range band + champion line -- fetched once, reused for every chart
  // on this page (not weight- or wrestler-specific).
  const bandPromise = fetch('/data/reports/aa_dpg_band.json').then(r => r.ok ? r.json() : null).catch(() => null);

  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function directionLabel(d) {
    if (d === 'transfer_in') return 'Transferred In';
    if (d === 'transfer_out') return 'Transferred Out';
    return 'Transferred In & Out';
  }
  function directionClass(d) {
    if (d === 'transfer_in') return 'xfer-badge--in';
    if (d === 'transfer_out') return 'xfer-badge--out';
    return 'xfer-badge--both';
  }

  // match-weighted averages / delta, counting ONLY seasons with n>=6 --
  // a 2-match season must never move these numbers. Query-vs-other-team
  // split is transfer-report-specific -- C.matchWeightedAvg does the
  // weighting math, this just does the two-way split around it.
  function computeStats(wrestler) {
    const qualifying = C.qualifyingSeasons(wrestler);
    const queryAvg = C.matchWeightedAvg(qualifying.filter(s => s.is_query_team));
    const otherAvg = C.matchWeightedAvg(qualifying.filter(s => !s.is_query_team));
    const delta = (queryAvg !== null && otherAvg !== null) ? queryAvg - otherAvg : null;
    return { queryAvg, otherAvg, delta, qualifying };
  }

  function fmt(v) {
    return v === null || v === undefined ? '—' : v.toFixed(2);
  }
  function fmtSigned(v) {
    if (v === null || v === undefined) return '—';
    return (v > 0 ? '+' : '') + v.toFixed(2);
  }

  function renderCard(wrestler, queryTeamName, colorMap, band) {
    const stats = computeStats(wrestler);
    const lastSeason = wrestler.seasons[wrestler.seasons.length - 1];
    const badgeColor = C.colorFor(lastSeason.team_slug, colorMap);

    const photo = wrestler.photo_url
      ? `<img class="xfer-photo" src="${C.esc(wrestler.photo_url)}" alt="${C.esc(wrestler.name)}" onerror="this.style.visibility='hidden'">`
      : `<div class="xfer-photo"></div>`;
    const wc = wrestler.weight_class ? `${wrestler.weight_class} lbs · ` : '';
    const path = (wrestler.school_path || []).join(' → ');

    const legendSchools = [];
    wrestler.seasons.forEach(s => {
      if (!legendSchools.some(l => l.slug === s.team_slug)) {
        legendSchools.push({ slug: s.team_slug, name: s.team });
      }
    });
    const legendHtml = legendSchools.map(l => {
      const c = C.colorFor(l.slug, colorMap);
      return `<span><span class="dot" style="background:${C.hexToRgba(c.hex, 0.85)}${c.stroke ? ';border:1.5px solid #211c16' : ''}"></span>${C.esc(l.name)}</span>`;
    }).join('');

    const card = document.createElement('div');
    card.className = 'xfer-card';
    card.innerHTML = `
      <div class="xfer-card-head">
        ${photo}
        <div class="xfer-name-block">
          <div class="xfer-name-row">
            <a class="xfer-name" href="/wrestler.html?id=${encodeURIComponent(wrestler.wrestler_id)}">${C.esc(wrestler.name || 'Unknown')}</a>
            ${wrestler.weight_class ? `<span class="xfer-weight-badge" style="background:${C.hexToRgba(badgeColor.hex, 0.85)}; color:${C.textColorFor(badgeColor.hex)}">${wrestler.weight_class}</span>` : ''}
          </div>
          <div class="xfer-meta">${wc}${C.esc(path)}</div>
          <span class="xfer-badge ${directionClass(wrestler.direction)}">${directionLabel(wrestler.direction)}</span>
        </div>
        <div class="xfer-stats">
          <div class="xfer-stat"><div class="label">${C.esc(queryTeamName)}</div><div class="value">${fmt(stats.queryAvg)}</div></div>
          <div class="xfer-stat"><div class="label">elsewhere</div><div class="value">${fmt(stats.otherAvg)}</div></div>
          <div class="xfer-stat xfer-stat--delta"><div class="label">Δ</div><div class="value">${fmtSigned(stats.delta)}</div></div>
        </div>
      </div>
      <div class="xfer-caption">match-weighted &middot; n&lt;6 seasons shown (hollow, marked *) but not in Δ</div>
      <div class="xfer-chart-wrap"></div>
      <div class="xfer-card-legend">${legendHtml}</div>
    `;
    document.getElementById('xfer-body').appendChild(card);
    card.querySelector('.xfer-chart-wrap').innerHTML = C.buildChartSVG(wrestler, colorMap, band);
    C.wireTooltips(card.querySelector('.xfer-chart-wrap'));
  }

  function render(data, colorMap, band) {
    const q = data.query;
    document.getElementById('xfer-title').textContent = `${q.team_name} — Transfer DPG Report`;
    document.getElementById('xfer-subtitle').textContent =
      `Roster window ${q.start_year}–${q.end_year} · full career DPG shown for every wrestler who played elsewhere before or after`;

    const nIn = data.wrestlers.filter(w => w.direction === 'transfer_in' || w.direction === 'both').length;
    const nOut = data.wrestlers.filter(w => w.direction === 'transfer_out' || w.direction === 'both').length;
    document.getElementById('xfer-summary').innerHTML = `
      <div class="stat"><div class="n">${data.wrestlers.length}</div><div class="label">Total transfers</div></div>
      <div class="stat"><div class="n">${nIn}</div><div class="label">Transferred in</div></div>
      <div class="stat"><div class="n">${nOut}</div><div class="label">Transferred out</div></div>
    `;

    const body = document.getElementById('xfer-body');
    body.innerHTML = '';
    if (!data.wrestlers.length) {
      body.innerHTML = `<div class="xfer-empty">No transfers found touching ${C.esc(q.team_name)} in ${q.start_year}–${q.end_year}.</div>`;
      return;
    }
    data.wrestlers.forEach(w => renderCard(w, q.team_name, colorMap, band));
  }

  const MIN_YEAR = 2012, MAX_YEAR = 2026;

  function loadReport(team, start, end) {
    const body = document.getElementById('xfer-body');
    body.innerHTML = '<div class="xfer-loading">Loading…</div>';
    const dataUrl = `/data/reports/transfers/${team}_${start}_${end}.json`;
    Promise.all([
      fetch(dataUrl).then(r => { if (!r.ok) throw new Error('report not found'); return r.json(); }),
      fetch('/data/team_colors.json').then(r => r.ok ? r.json() : { teams: {}, default: C.DEFAULT_COLOR }).catch(() => ({ teams: {}, default: C.DEFAULT_COLOR })),
      bandPromise,
    ])
      .then(([data, colorMap, band]) => render(data, colorMap, band))
      .catch(() => {
        body.innerHTML =
          `<div class="xfer-empty">No report generated yet for this query.<br>Run: <code>python scripts/reports/build_transfer_dpg_report.py --team ${C.esc(team)} --start-year ${C.esc(start)} --end-year ${C.esc(end)}</code></div>`;
      });
  }

  const startSelect = document.getElementById('xfer-start-select');
  const endSelect = document.getElementById('xfer-end-select');
  const yearOptions = Array.from({ length: MAX_YEAR - MIN_YEAR + 1 }, (_, i) => MAX_YEAR - i)
    .map(y => `<option value="${y}">${y}</option>`).join('');
  startSelect.innerHTML = yearOptions;
  endSelect.innerHTML = yearOptions;

  const initialTeam = qs('team');
  const initialStart = qs('start') || String(MAX_YEAR - 3);
  const initialEnd = qs('end') || String(MAX_YEAR);

  fetch('/data/team_colors.json').then(r => r.json()).then(colorMap => {
    const teams = Object.entries(colorMap.teams || {})
      .map(([slug, t]) => ({ slug, name: t.name }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const teamSelect = document.getElementById('xfer-team-select');
    teamSelect.innerHTML = teams.map(t => `<option value="${t.slug}">${t.name}</option>`).join('');
    if (initialTeam) teamSelect.value = initialTeam;
    startSelect.value = initialStart;
    endSelect.value = initialEnd;

    document.getElementById('xfer-go').addEventListener('click', () => {
      const team = teamSelect.value;
      const start = startSelect.value;
      const end = endSelect.value;
      if (!team) return;
      const url = new URL(window.location);
      url.searchParams.set('team', team);
      url.searchParams.set('start', start);
      url.searchParams.set('end', end);
      window.history.pushState({}, '', url);
      loadReport(team, start, end);
    });

    if (initialTeam) {
      loadReport(initialTeam, initialStart, initialEnd);
    } else {
      document.getElementById('xfer-body').innerHTML =
        '<div class="xfer-empty">Pick a team and year range above, then click View.</div>';
    }
  }).catch(() => {
    document.getElementById('xfer-body').innerHTML =
      '<div class="xfer-empty">Team list unavailable.</div>';
  });
})();
  </script>
</body>
</html>
