<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Match Index Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
</head>
<body>
  <script src="/header.js"></script>
  <div class="page-container">
    <header class="header">
      <h1>Match Index Leaderboard</h1>
      <div class="header-subline" id="season-info"></div>
      <p class="header-explainer">
        Match Index (MI) measures how much value a wrestler adds per match relative to a replacement-level Division I starter, adjusted for opponent quality.
      </p>
    </header>

    <section class="section">
      <div id="weight-tabs-container" class="weight-tabs-container" role="tablist" aria-label="Weight class filter">
        <!-- Tabs will be inserted here by JS -->
      </div>
      <p class="threshold-explainer" id="threshold-explainer">
        <!-- Dynamic text will be inserted here -->
      </p>
      <div class="table-wrapper">
        <table id="mv-leaderboard-table">
          <thead>
            <tr>
              <th>MI Rank</th>
              <th>Name</th>
              <th>Team</th>
              <th>Weight</th>
              <th>Wt Class Rank</th>
              <th class="col-mv">MI <span class="tooltip-icon" data-tooltip="mv">→</span></th>
              <th>Matches</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/leaderboards/mat_value.js"></script>
</body>
</html>
