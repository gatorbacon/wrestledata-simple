<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>xTP Team Projections</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .expandable-row {
      cursor: pointer;
    }
    .expand-icon {
      display: inline-block;
      width: 12px;
      text-align: center;
      margin-right: 8px;
      color: var(--muted);
    }
    .expanded .expand-icon::before {
      content: "▼";
    }
    .collapsed .expand-icon::before {
      content: "▶";
    }
    .weight-breakdown {
      display: none;
    }
    .weight-breakdown.expanded {
      display: table-row;
    }
    .weight-breakdown td {
      padding: 12px;
      background-color: var(--panel);
    }
    .weight-breakdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
    }
    .weight-breakdown th,
    .weight-breakdown td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .weight-breakdown th {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.9em;
      background-color: var(--panel-2);
    }
    .weight-breakdown tbody tr:last-child td {
      border-bottom: none;
    }
    .no-qualifier {
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="header">
      <h1>
        xTP Team Projections
        <span class="tooltip-icon" data-tooltip="xtp">ⓘ</span>
      </h1>
      <div class="header-subline" id="season-info"></div>
    </header>

    <section class="section">
      <div class="table-wrapper">
        <table id="xtp-team-leaderboard-table">
          <thead>
            <tr>
              <th style="width: 40px;"></th>
              <th>Rank</th>
              <th>Team</th>
              <th class="col-xtp">xTP <span class="tooltip-icon" data-tooltip="xtp">ⓘ</span></th>
              <th class="xtp-component-col">xTP_P <span class="tooltip-icon" data-tooltip="xtp-p">ⓘ</span></th>
              <th class="xtp-component-col">xTP_A <span class="tooltip-icon" data-tooltip="xtp-a">ⓘ</span></th>
              <th class="xtp-component-col">xTP_B <span class="tooltip-icon" data-tooltip="xtp-b">ⓘ</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/leaderboards/xtp/teams.js"></script>
</body>
</html>
