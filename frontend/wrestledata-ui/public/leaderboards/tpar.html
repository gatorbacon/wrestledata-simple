<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TPAR Rankings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260912" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
</head>
<body>
  <script src="/header.js?v=20260903"></script>
  <div class="page-container">
    <header class="header">
      <h1>TPAR Rankings</h1>
      <div class="header-subline" id="season-info"></div>
      <p class="header-explainer">
        TPAR — Team Points Above Replacement — estimates how many team points a wrestler contributes above a replacement-level starter, using match-level scoring and dominance signals.
      </p>
    </header>

    <section class="section">
      <div id="weight-tabs-container" class="weight-tabs-container" role="tablist" aria-label="Weight class filter">
        <!-- Tabs will be inserted here by JS -->
      </div>
      <p class="threshold-explainer" id="threshold-explainer">
        <!-- Dynamic text will be inserted here -->
      </p>
      <div class="table-wrapper">
        <table id="mv-leaderboard-table">
          <thead>
            <tr>
              <th>TPAR Rank</th>
              <th>Name</th>
              <th>Team</th>
              <th>Weight</th>
              <th>Wt Class Rank</th>
              <th class="col-mv">TPAR <span class="tooltip-icon" data-tooltip="mv">→</span></th>
              <th>Matches</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/tooltips.js"></script>
  <script src="/leaderboards/tpar.js"></script>
</body>
</html>
