<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wins Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260912" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
</head>
<body>
  <script src="/header.js?v=20260903"></script>
  <div class="page-container">
    <header class="header">
      <h1>Wins Leaderboard</h1>
      <div class="header-subline" id="season-info"></div>
    </header>

    <section class="section">
      <div id="weight-tabs-container" class="weight-tabs-container" role="tablist" aria-label="Weight class filter">
        <!-- Tabs will be inserted here by JS -->
      </div>
      <div class="table-wrapper">
        <table id="leaderboard-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Team</th>
              <th>Weight</th>
              <th>Wins</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/leaderboards/simple_leaderboard.js"></script>
  <script>
    // Initialize wins leaderboard
    initSimpleLeaderboard({
      statType: 'wins',
      title: 'Wins Leaderboard',
      tableId: 'leaderboard-table',
      containerId: 'weight-tabs-container',
      seasonInfoId: 'season-info'
    });
  </script>
</body>
</html>
