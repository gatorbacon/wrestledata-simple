<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NCAA Wrestling Championships (Lab) — MatSavant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="NCAA wrestling championship brackets by weight class, placewinners and team scores." />
  <link rel="stylesheet" href="/styles.css?v=20260921" />

<body>
  <script src="/analytics.js?v=20260911"></script>
  <script src="/header.js?v=20260908"></script>

    <main class="bk">
      <p class="bk-crumb"><a href="/lab/index.html">Lab</a> › <a href="index.html">NCAA Bracket Archive</a></p>

        <h1 id="title">NCAA Wrestling Championships</h1>
        <nav class="bk-yearnav" id="yearnav" aria-label="Other years"></nav>
      </div>
      <div class="bk-facts" id="facts"></div>
      <ul class="bk-notes" id="notes"></ul>

        <div id="other"></div>
      </div>
      <div id="panel-team" hidden></div>
