<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--EDGE:HEAD--><title>Team Profile</title><!--/EDGE:HEAD-->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260921" />
</head>

<body>
  <script src="/analytics.js?v=20260911"></script>
  <script src="/header.js?v=20260908"></script>
  <div class="page-container">

    <!-- HEADER: identity (left) + projected team points (right) -->
    <header class="header tp2-header">
      <div class="tp2-header-left">
        <img class="tp2-logo" id="team-logo" alt="" hidden />
        <div class="tp2-header-text">
          <h1 id="team-name"></h1>
          <div class="tp2-subline" id="team-subline"></div>
          <div class="tp2-subline" id="team-race-line"></div>
        </div>
      </div>
      <div class="tp2-header-right">
        <div class="tp2-points-value" id="hero-value">—</div>
        <div class="tp2-points-label">projected team points</div>
        <div class="tp2-oneliner" id="hero-oneliner"></div>
      </div>
    </header>

    <!-- STARTING ROSTER -->
    <section class="section tp2-panel-section" id="starting-roster-section">
      <h2>Starting Roster</h2>
      <div class="table-wrapper">
        <table id="starting-roster-table" class="tp2-roster-table">
          <thead>
            <tr>
              <th class="tp2-col-weight" style="width: 48px;"><span class="tp2-th-full">Weight</span><span class="tp2-th-short">Wt</span></th>
              <th>Wrestler</th>
              <th class="tp2-col-record"><span class="tp2-th-full">Record</span><span class="tp2-th-short">Rec</span></th>
              <th class="num tp2-col-dpg" data-tooltip="mv">DPG</th>
              <th class="num tp2-col-points"><span class="tp2-th-full">Points</span><span class="tp2-th-short">Pts</span></th>
              <th class="tp2-col-risk">Seed risk</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- SCORING PER 7 MINUTES / HOW THEY FINISH -->
    <section class="section tp2-card-grid">
      <div class="profile-section" id="score-card"></div>
      <div class="profile-section" id="finish-card"></div>
    </section>

    <!-- REMAINING ROSTER -->
    <section class="section tp2-panel-section tp2-remaining-roster-section" id="remaining-roster-section">
      <h2>Remaining Roster</h2>
      <div class="table-wrapper">
        <table class="tp2-roster-table" id="remaining-roster-table">
          <thead>
            <tr>
              <th class="tp2-col-weight" style="width: 48px;"><span class="tp2-th-full">Weight</span><span class="tp2-th-short">Wt</span></th>
              <th>Wrestler</th>
              <th class="tp2-col-record"><span class="tp2-th-full">Record</span><span class="tp2-th-short">Rec</span></th>
              <th class="num tp2-col-dpg">DPG</th>
            </tr>
          </thead>
          <tbody id="roster-body"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="/seo_text.js?v=20261007"></script>
  <script src="/team.js?v=20261007"></script>
  <script src="/tooltips.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Name-based address /team/penn-state (served by the _redirects rewrite), or the old ?team=penn_state
      const pathMatch = window.location.pathname.match(/^\/team\/([^/]+)\/?$/);
      const teamId = pathMatch
        ? MatSavantSEO.teamIdFromPath(decodeURIComponent(pathMatch[1]))
        : new URLSearchParams(window.location.search).get("team");
      if (!teamId) {
        document.getElementById("team-name").textContent = "No team selected";
        return;
      }
      loadTeam(teamId);
    });
  </script>
</body>
</html>
