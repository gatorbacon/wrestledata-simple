<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Team Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260913" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="/search_index.js"></script>
</head>

<body>
  <script src="/header.js?v=20260903"></script>
  <div class="page-container">

    <!-- HEADER -->
    <header class="header">
      <div class="header-row">
        <img class="tp2-logo" id="team-logo" alt="" hidden />
        <div class="header-text">
          <h1 id="team-name"></h1>
          <div class="tp2-chip-row" id="team-chips"></div>
          <div class="tp2-resume-line" id="team-resume"></div>
        </div>
      </div>
    </header>

    <!-- HERO: PROJECTED NCAA TEAM POINTS -->
    <section class="section tp2-hero-section" id="hero-section">
      <div class="tp2-hero-top">
        <div class="tp2-hero-main">
          <div class="tp2-hero-value" id="hero-value">—</div>
          <div class="tp2-hero-label">Projected NCAA team points</div>
        </div>
        <div class="tp2-hero-rank" id="hero-rank"></div>
      </div>

      <div class="tp2-segmented-bar" id="hero-segmented-bar"></div>
      <div class="tp2-segmented-legend" id="hero-segmented-legend"></div>

      <div class="tp2-oneliner" id="hero-oneliner"></div>

      <div class="tp2-top5" id="hero-top5">
        <div class="tp2-top5-title">Top 5 projected teams</div>
        <div class="tp2-top5-rows" id="hero-top5-rows"></div>
      </div>
    </section>

    <!-- STARTING ROSTER -->
    <section class="section" id="starting-roster-section">
      <h2>Starting Roster</h2>
      <div class="table-wrapper">
        <table id="starting-roster-table" class="tp2-roster-table">
          <thead>
            <tr>
              <th>Weight</th>
              <th>Wrestler</th>
              <th>Rank</th>
              <th class="num" data-tooltip="mv">TPAR</th>
              <th class="num">Proj. pts</th>
              <th>Breakdown</th>
              <th>Seed risk</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- HOW THEY SCORE / HOW THEY FINISH -->
    <section class="tp2-card-grid">
      <div class="profile-section" id="score-card"></div>
      <div class="profile-section" id="finish-card"></div>
    </section>

    <!-- REMAINING ROSTER -->
    <section class="section section--remaining-roster">
      <h2>Remaining Roster</h2>
      <div class="table-wrapper">
        <table class="tp2-roster-table" id="next-up-table">
          <thead>
            <tr><th>Weight</th><th>Wrestler</th><th>Rank</th><th class="num">TPAR</th></tr>
          </thead>
          <tbody id="next-up-body"></tbody>
        </table>
      </div>
      <button type="button" class="tp2-toggle-rest" id="toggle-rest-btn">Show the rest (<span id="rest-count">0</span>)</button>
      <div class="table-wrapper" id="rest-wrapper" hidden>
        <table class="tp2-roster-table" id="rest-table">
          <thead>
            <tr><th>Weight</th><th>Wrestler</th><th>Rank</th><th class="num">TPAR</th></tr>
          </thead>
          <tbody id="rest-body"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="/team.js?v=20260906"></script>
  <script src="/tooltips.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const teamId = new URLSearchParams(window.location.search).get("team");
      if (!teamId) {
        document.getElementById("team-name").textContent = "No team selected";
        return;
      }
      loadTeam(teamId);
    });
  </script>
</body>
</html>
