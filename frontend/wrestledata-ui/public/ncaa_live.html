<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCAA Wrestling — Live Prediction Leaderboard</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2d3147;
    --text: #e8eaf6;
    --muted: #7b7f9e;
    --accent: #5c6bc0;
    --green: #4caf50;
    --red: #f44336;
    --amber: #ff9800;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  header h1 span { color: var(--accent); }
  .header-meta { display: flex; gap: 20px; font-size: 13px; color: var(--muted); align-items: center; }
  .header-meta strong { color: var(--text); }
  .refresh-badge {
    font-size: 12px;
    background: var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    color: var(--muted);
  }
  .refresh-badge.fresh { color: var(--green); }
  .year-select {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }
  .year-select:hover { border-color: #7986cb; }
  .year-select option { background: var(--card); }

  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  /* Leaderboard table */
  .leaderboard { width: 100%; border-collapse: collapse; }
  .leaderboard th {
    padding: 6px 8px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .leaderboard th.r { text-align: right; }
  .leaderboard td {
    padding: 7px 8px;
    border-bottom: 1px solid rgba(45,49,71,0.5);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }
  .leaderboard td.r { text-align: right; }
  .leaderboard tr:last-child td { border-bottom: none; }
  .leaderboard tr:hover td { background: rgba(92,107,192,0.05); }

  .rank { font-weight: 600; color: var(--muted); width: 28px; }
  .team-name { font-weight: 600; }
  .proj { font-weight: 700; font-size: 14px; }
  .delta-pos { color: var(--green); font-weight: 600; }
  .delta-neg { color: var(--red); font-weight: 600; }
  .delta-neu { color: var(--muted); }
  .wrestlers-left { color: var(--muted); font-size: 12px; }

  /* Chart */
  .chart-container { padding: 16px; }

  /* Weight sections */
  .weights-section { margin-top: 8px; }
  .weight-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .weight-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
  }
  .weight-toggle:hover { background: rgba(92,107,192,0.06); }
  .weight-toggle .arrow { transition: transform 0.2s; font-size: 12px; }
  .weight-toggle.open .arrow { transform: rotate(90deg); }
  .weight-body { display: none; padding: 0 16px 16px; }
  .weight-body.open { display: block; }

  .wrestler-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .wrestler-table th {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border);
  }
  .wrestler-table th.r { text-align: right; }
  .wrestler-table td {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(45,49,71,0.4);
    font-variant-numeric: tabular-nums;
  }
  .wrestler-table td.r { text-align: right; }
  .wrestler-table tr:last-child td { border-bottom: none; }
  .eliminated { opacity: 0.45; }
  .seed-badge {
    display: inline-block;
    background: var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 6px;
    min-width: 24px;
    text-align: center;
  }
  .seed-1 { background: #ffd700; color: #111; }
  .seed-2 { background: #c0c0c0; color: #111; }
  .seed-3 { background: #cd7f32; color: #111; }

  .aa-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    background: var(--accent);
    vertical-align: middle;
    margin-left: 6px;
  }

  .section-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 20px 0 8px;
    font-weight: 600;
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 16px;
  }
  .error {
    text-align: center;
    padding: 40px;
    color: var(--red);
  }

  /* Big Moments feed */
  .moment-card { background:rgba(255,255,255,0.03); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; display:flex; align-items:flex-start; gap:12px; }
  .moment-card:hover { background:rgba(92,107,192,0.06); }
  .moment-tag { flex-shrink:0; font-size:10px; font-weight:700; letter-spacing:.08em;
    padding:3px 7px; border-radius:4px; text-transform:uppercase; min-width:52px; text-align:center; }
  .tag-upset  { background:rgba(244,67,54,.18);  color:#ef5350; border:1px solid rgba(244,67,54,.3); }
  .tag-bonus  { background:rgba(255,152,0,.18);  color:#ffa726; border:1px solid rgba(255,152,0,.3); }
  .tag-both   { background:rgba(156,39,176,.18); color:#ce93d8; border:1px solid rgba(156,39,176,.3); }
  .tag-none   { background:var(--border); color:var(--muted); }
  .tag-lb     { background:rgba(92,107,192,.25); color:#7986cb; border:1px solid rgba(92,107,192,.4); }
  .tag-usc    { background:rgba(244,67,54,.18);  color:#ef5350; border:1px solid rgba(244,67,54,.3); }
  .moment-body { flex:1; min-width:0; }
  .moment-meta  { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .moment-match { font-weight:600; font-size:13px; margin-bottom:4px; }
  .moment-impacts { font-size:12px; }
  .imp-pos { color:var(--green); font-weight:600; }
  .imp-neg { color:var(--red);   font-weight:600; }
  .moment-changes { display:flex; flex-direction:column; gap:3px; }
  .lb-change { font-size:13px; font-weight:600; }
</style>
</head>
<body>
<header>
  <div>
    <h1>NCAA Wrestling <span>Live Prediction Leaderboard</span></h1>
  </div>
  <div class="header-meta">
    <select class="year-select" id="year-select" onchange="onYearChange(this.value)"></select>
    <div>Matches: <strong id="matches-stat">—</strong></div>
  </div>
  <div class="refresh-badge" id="refresh-badge">Refreshing every 120s</div>
</header>

<main>
  <div id="loading" class="loading">Loading tournament data...</div>
  <div id="content" style="display:none">

    <!-- Top grid: leaderboard + chart -->
    <div class="grid">
      <!-- Team leaderboard -->
      <div class="card">
        <div class="card-header">Top 10 Projected Teams</div>
        <table class="leaderboard" id="team-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Team</th>
              <th class="r">Projected</th>
              <th class="r">Score Range</th>
              <th class="r">Place</th>
              <th class="r">Δ</th>
              <th class="r">Active</th>
            </tr>
          </thead>
          <tbody id="team-tbody"></tbody>
        </table>
      </div>

      <!-- Projection history chart -->
      <div class="card">
        <div class="card-header">Projection History (Top 10 Teams)</div>
        <div class="chart-container" id="chart-div" style="height:420px"></div>
      </div>
    </div>

    <!-- Bottom grid: Big Moments + Wrestler Movers -->
    <div class="grid" style="margin-bottom:24px">
      <div class="card" id="moments-card">
        <div class="card-header">
          Big Moments
          <span id="moments-count" style="color:var(--muted);font-weight:400;font-size:11px;margin-left:8px"></span>
        </div>
        <div id="moments-feed" style="max-height:420px;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px"></div>
      </div>
      <div class="card" id="movers-card">
        <div class="card-header">Wrestler Movers</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 45px)">
          <div style="border-right:1px solid var(--border);padding:12px 14px;overflow-y:auto">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--green);margin-bottom:8px">Top Gainers</div>
            <div id="gainers-list"></div>
          </div>
          <div style="padding:12px 14px;overflow-y:auto">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);margin-bottom:8px">Top Losers</div>
            <div id="losers-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Team and Weight-class detail sections -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
      <div>
        <h3 class="section-label">By Team</h3>
        <div class="weights-section" id="teams-section"></div>
      </div>
      <div>
        <h3 class="section-label">By Weight</h3>
        <div class="weights-section" id="weights-section"></div>
      </div>
    </div>
  </div>
</main>

<script>
// ============================================================
// Configuration
// ============================================================
const LIVE_YEAR = 2026;  // current live tournament year (no replay file yet)
const YEARS = [2026, 2025, 2024, 2023, 2022, 2021, 2019];  // 2014-2018 used a different bracket structure
const REFRESH_MS = 120_000;
const WEIGHTS = [125, 133, 141, 149, 157, 165, 174, 184, 197, 285];
const TEAM_COLORS = [
  '#5c6bc0','#e91e63','#00bcd4','#ff9800','#4caf50',
  '#9c27b0','#f44336','#03a9f4','#8bc34a','#ff5722',
];

// ============================================================
// State
// ============================================================
let liveData = null;
let lastModified = null;
let secondsSinceRefresh = 0;
let refreshTimer = null;
let countdownTimer = null;
let selectedYear = YEARS[0];

const LIVE_DATA_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:'
  ? 'live_data.json'
  : 'https://wrestledata-simple-production.up.railway.app/live_data.json';

function dataUrlForYear(year) {
  return year === LIVE_YEAR ? LIVE_DATA_URL : `data/${year}/simulation_replay.json`;
}

function initYearSelect() {
  const sel = document.getElementById('year-select');
  YEARS.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y === LIVE_YEAR ? `${y} ▶ LIVE` : String(y);
    if (y === selectedYear) opt.selected = true;
    sel.appendChild(opt);
  });
}

function onYearChange(year) {
  selectedYear = parseInt(year);
  clearInterval(refreshTimer);
  clearInterval(countdownTimer);
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  loadAndRender();
  // Only auto-refresh for the live year
  if (selectedYear === LIVE_YEAR) {
    refreshTimer = setInterval(loadAndRender, REFRESH_MS);
    startCountdown();
  } else {
    document.getElementById('refresh-badge').textContent = `${year} replay`;
    document.getElementById('refresh-badge').className = 'refresh-badge';
  }
}

// ============================================================
// Data loading
// ============================================================
async function fetchData() {
  try {
    const url = dataUrlForYear(selectedYear) + '?_=' + Date.now();
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(resp.statusText);
    const data = await resp.json();
    return data;
  } catch(e) {
    console.error('Fetch error:', e);
    return null;
  }
}

// ============================================================
// Rendering
// ============================================================
function renderAll(data) {
  renderHeader(data);
  const {teamRanks, preTourney} = buildTeamRanks(data);
  renderTeamTable(teamRanks, preTourney, data);
  renderChart(data, teamRanks);
  renderMoments(data);
  renderMovers(data);
  renderTeams(data, data.pre_tourney_predictions || {});
  renderWeights(data, teamRanks);
}

function renderMoments(data) {
  const moments = data.moments || [];
  if (!moments.length) {
    document.getElementById('moments-count').textContent = '';
    document.getElementById('moments-feed').innerHTML =
      '<div style="color:var(--muted);font-size:12px;padding:8px 0">No big moments yet.</div>';
    return;
  }
  document.getElementById('moments-count').textContent =
    `${moments.length} moment${moments.length !== 1 ? 's' : ''}`;

  const display = moments.slice().reverse().slice(0, 50);
  document.getElementById('moments-feed').innerHTML = display.map(m => {
    if (m.type === 'penalty') {
      return `<div class="moment-card">
        <div class="moment-tag tag-usc">USC</div>
        <div class="moment-body">
          <div class="moment-meta">Unsportsmanlike Conduct Penalty</div>
          <div class="moment-match"><b>${esc(m.team)}</b> — <span class="imp-neg">${m.delta.toFixed(1)} pts</span> (total penalty: ${m.total.toFixed(1)})</div>
        </div>
      </div>`;
    }
    if (m.type === 'leaderboard') {
      const changesHtml = (m.changes || [])
        .map(c => `<div class="lb-change">${esc(c)}</div>`)
        .join('');
      return `<div class="moment-card">
        <div class="moment-tag tag-lb">STANDINGS</div>
        <div class="moment-body">
          <div class="moment-meta">${esc(m.round_label)} · Match #${m.match_n}</div>
          <div class="moment-changes">${changesHtml}</div>
        </div>
      </div>`;
    }

    let tagCls = 'tag-none', tagText = '—';
    if (m.tag === 'UPSET+BONUS') { tagCls = 'tag-both';  tagText = 'UPSET+BONUS'; }
    else if (m.tag === 'UPSET')  { tagCls = 'tag-upset'; tagText = 'UPSET'; }
    else if (m.tag === 'BONUS')  { tagCls = 'tag-bonus'; tagText = 'BONUS'; }

    const impactHtml = Object.entries(m.impacts || {})
      .sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]))
      .map(([team, d]) => {
        const cls = d > 0 ? 'imp-pos' : 'imp-neg';
        return `<span class="${cls}">${d > 0 ? '+' : ''}${d.toFixed(1)}</span> ${esc(team)}`;
      }).join(' &nbsp;·&nbsp; ');

    return `<div class="moment-card">
      <div class="moment-tag ${tagCls}">${tagText}</div>
      <div class="moment-body">
        <div class="moment-meta">${esc(m.round_label)} · ${m.weight} lbs · Match #${m.match_n}</div>
        <div class="moment-match">
          <b>#${m.winner_seed} ${esc(m.winner_name)}</b> (${esc(m.winner_team)})
          def. <b>#${m.loser_seed} ${esc(m.loser_name)}</b> (${esc(m.loser_team)})
          by ${m.result_type}
        </div>
        <div class="moment-impacts">${impactHtml}</div>
      </div>
    </div>`;
  }).join('');
}

function renderHeader(data) {
  const total = data.matches_total || 330;
  const done = data.matches_completed || 0;
  document.getElementById('matches-stat').textContent =
    `${done} / ${total}`;

}

function buildTeamRanks(data) {
  const proj = data.current_projection || {};
  const pre = data.pre_tourney_predictions || {};

  // Count active wrestlers per team
  const active = {};
  const wrestlers = data.wrestlers || {};
  for (const [wt, weightData] of Object.entries(wrestlers)) {
    for (const [seed, info] of Object.entries(weightData)) {
      if (info.alive) {
        const t = info.team;
        active[t] = (active[t] || 0) + 1;
      }
    }
  }

  const ranked = Object.entries(proj)
    .map(([team, pts]) => ({team, pts, pre: pre[team] || 0, active: active[team] || 0}))
    .sort((a, b) => b.pts - a.pts);

  return {teamRanks: ranked, preTourney: pre};
}

function fmtDelta(delta) {
  if (Math.abs(delta) < 0.05) return {text: '—', cls: 'delta-neu'};
  if (delta > 0) return {text: '+' + delta.toFixed(1), cls: 'delta-pos'};
  return {text: delta.toFixed(1), cls: 'delta-neg'};
}

function renderTeamTable(teamRanks, preTourney, data) {
  const tbody = document.getElementById('team-tbody');
  const ranges = data.score_ranges || {};
  tbody.innerHTML = '';
  teamRanks.slice(0, 10).forEach((row, i) => {
    const delta = row.pts - (row.pre || 0);
    const d = fmtDelta(delta);
    const r = ranges[row.team] || {};
    const hasRange = r.min_score != null;
    function ord(n) { const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
    const placeStr = hasRange ? (r.best_place===r.worst_place ? ord(r.best_place) : ord(r.best_place)+'–'+ord(r.worst_place)) : '';
    const scoreStr = hasRange ? r.min_score.toFixed(1)+' – '+r.max_score.toFixed(1) : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${i+1}</td>
      <td class="team-name">${esc(row.team)}</td>
      <td class="r proj">${row.pts.toFixed(1)}</td>
      <td class="r" style="font-size:12px;color:var(--muted)">${scoreStr}</td>
      <td class="r" style="font-size:11px;color:var(--muted)">${placeStr || '—'}</td>
      <td class="r"><span class="${d.cls}" style="font-size:12px">${d.text}</span></td>
      <td class="r wrestlers-left">${row.active}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderChart(data, teamRanks) {
  const history = data.history || [];
  const sortedMatches = data.sorted_matches || [];
  const top10teams = teamRanks.slice(0, 10).map(r => r.team);

  // Derive session boundaries from history
  const sessionStarts = {};
  history.forEach(h => { if (!sessionStarts[h.round]) sessionStarts[h.round] = h.match_n; });
  const lastCompleted = history.reduce((mx, h) => Math.max(mx, h.match_n), 0);

  const s2 = sessionStarts['R16'] || lastCompleted;
  const s3 = sessionStarts['QF']  || lastCompleted;
  const s4 = sessionStarts['SF']  || lastCompleted;
  const s5 = lastCompleted + 1;
  const s6 = s5 + 40;
  const s7 = s6 + 10;
  const maxMatch = s7 + 5;

  const sessions = [
    {name: 'R32 + Consi 1',     start: 0,   end: s2-1, completed: true},
    {name: 'R16 + Consi 2',     start: s2,  end: s3-1, completed: true},
    {name: 'QF + Consi 3/4',    start: s3,  end: s4-1, completed: true},
    {name: 'SF + Consi QF',     start: s4,  end: s5-1, completed: true},
    {name: 'Consi SF + Medals', start: s5,  end: s6-1, completed: false},
    {name: 'Finals',             start: s6,  end: s7,   completed: false},
  ];

  function matchLabel(m) {
    if (!m) return '';
    const score = m.score || '';
    const method = score ? m.result_type + ' ' + score : m.result_type;
    return m.winner_name + ' def. ' + m.loser_name + ' (' + method + ') \u2014 ' + m.weight + 'lb';
  }

  const traces = top10teams.map((team, i) => {
    const x = [], y = [], cd = [];
    let prevProj = null;
    history.forEach(h => {
      if (!h.projections || h.projections[team] == null) return;
      const mn = h.match_n;
      const proj = h.projections[team];

      if (prevProj === null) {
        // Always plot the pre-tourney baseline
        x.push(mn); y.push(proj);
        cd.push(['Pre-tournament projection', proj, '']);
        prevProj = proj;
        return;
      }

      const delta = proj - prevProj;
      prevProj = proj;
      if (Math.abs(delta) < 0.05) return; // skip zero-change points

      const label = h.match ? matchLabel(h.match)
        : (sortedMatches[mn - 1] ? matchLabel(sortedMatches[mn - 1]) : 'Match #' + mn);
      const deltaStr = (delta > 0 ? '+' : '') + delta.toFixed(1);
      x.push(mn); y.push(proj);
      cd.push([label, proj, deltaStr]);
    });
    return {
      x, y, name: team, mode: 'lines',
      line: {color: TEAM_COLORS[i % TEAM_COLORS.length], width: 2, shape: 'hv'},
      customdata: cd, showlegend: false,
      hovertemplate: '<b>%{fullData.name}</b><br>%{customdata[0]}<br>Proj: %{customdata[1]:.1f}  %{customdata[2]}<extra></extra>',
    };
  });

  // De-collide team name labels at right edge
  const lastProj = {};
  top10teams.forEach(team => {
    const entries = history.filter(h => h.projections && h.projections[team] != null);
    if (entries.length) lastProj[team] = entries[entries.length - 1].projections[team];
  });
  const allVals = history.flatMap(h => Object.values(h.projections || {}));
  const yRange = Math.max(...allVals) - Math.min(...allVals);
  const minSpacing = yRange * (11 / 370);

  const labels = top10teams
    .map((team, i) => ({team, y: lastProj[team] || 0, color: TEAM_COLORS[i]}))
    .sort((a, b) => b.y - a.y);
  for (let i = 1; i < labels.length; i++) {
    if (labels[i - 1].y - labels[i].y < minSpacing)
      labels[i].y = labels[i - 1].y - minSpacing;
  }
  const labelAnnotations = labels.map(lbl => ({
    xref: 'x', yref: 'y',
    x: lastCompleted + 2, y: lbl.y,
    text: lbl.team, showarrow: false,
    font: {size: 10, color: lbl.color},
    xanchor: 'left', yanchor: 'middle',
  }));

  // Session boundary shapes + labels
  const shapes = [], annotations = [...labelAnnotations];
  const minWide = maxMatch * 0.12;
  sessions.forEach((s, i) => {
    const width = Math.min(s.end, maxMatch) - s.start;
    const labelColor = s.completed ? '#7b7f9e' : '#3d4160';
    shapes.push({
      type: 'rect', xref: 'x', yref: 'paper',
      x0: s.start, x1: s.end, y0: 0, y1: 1,
      fillcolor: i % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0)',
      line: {width: 0},
    });
    if (i > 0) shapes.push({
      type: 'line', xref: 'x', yref: 'paper',
      x0: s.start, x1: s.start, y0: 0, y1: 1,
      line: {color: 'rgba(255,255,255,0.15)', width: 1, dash: 'dot'},
    });
    if (width >= minWide) {
      annotations.push({
        xref: 'x', yref: 'paper',
        x: (s.start + Math.min(s.end, maxMatch)) / 2, y: 1.02,
        text: s.name, showarrow: false,
        font: {size: 10, color: labelColor},
        xanchor: 'center', yanchor: 'bottom',
      });
    } else {
      annotations.push({
        xref: 'x', yref: 'paper',
        x: s.start + 1, y: 1.0,
        text: s.name + (s.completed ? '' : ' <i>(upcoming)</i>'),
        showarrow: false,
        font: {size: 9, color: labelColor},
        xanchor: 'left', yanchor: 'bottom', textangle: -40,
      });
    }
  });

  const layout = {
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: {color: '#7b7f9e', size: 11},
    xaxis: {range: [0, maxMatch], gridcolor: '#2d3147', color: '#7b7f9e', showticklabels: false},
    yaxis: {gridcolor: '#2d3147', color: '#7b7f9e'},
    margin: {l: 50, r: 110, t: 30, b: 20},
    hovermode: 'closest',
    shapes, annotations,
  };

  Plotly.react('chart-div', traces, layout, {responsive: true, displayModeBar: false});
}

function wrestlerRowHtml(r, secondaryLine, rowNum) {
  const seedCls = r.seed <= 3 ? `seed-${r.seed}` : '';
  const aaPct = Math.round((r.aa_prob || 0) * 100);
  const barWidth = Math.min(60, aaPct * 0.6);
  const rowCls = r.alive ? '' : 'eliminated';
  let deltaHtml;
  if (r.initial_projected == null) {
    deltaHtml = '<span class="delta-neu">—</span>';
  } else {
    const delta = r.projected_total - r.initial_projected;
    const d = fmtDelta(delta);
    deltaHtml = `<span class="${d.cls}">${d.text}</span>`;
  }
  return `
    <tr class="${rowCls}">
      <td>
        ${rowNum != null ? `<span style="color:var(--muted);font-size:11px;margin-right:6px">${rowNum}.</span>` : ''}<span class="seed-badge ${seedCls}">${r.seed}</span><strong>${esc(r.name)}</strong>
        <br><span style="font-size:11px;color:var(--muted);padding-left:${rowNum != null ? 36 : 30}px">${esc(secondaryLine)}</span>
      </td>
      <td class="r">${deltaHtml}</td>
      <td class="r"><strong>${r.projected_total.toFixed(1)}</strong></td>
      <td class="r" style="opacity:0.6">${r.actual.toFixed(1)}</td>
      <td class="r">${aaPct}%<span class="aa-bar" style="width:${barWidth}px"></span></td>
    </tr>`;
}

function wrestlerTableHtml(rowsHtml) {
  return `<table class="wrestler-table">
    <thead><tr>
      <th>Wrestler</th>
      <th class="r">Δ</th>
      <th class="r">Proj</th>
      <th class="r">Actual</th>
      <th class="r">P(AA)</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;
}

function renderWeights(data, teamRanks) {
  const section = document.getElementById('weights-section');
  const wrestlers = data.wrestlers || {};

  let html = '';
  for (const wt of WEIGHTS) {
    const wtData = wrestlers[String(wt)];
    if (!wtData) continue;
    const rows = Object.entries(wtData)
      .map(([seed, info]) => ({seed: parseInt(seed), ...info}))
      .sort((a, b) => a.seed - b.seed);
    const rowsHtml = rows.map(r => wrestlerRowHtml(r, r.team)).join('');
    html += `
      <div class="weight-group">
        <div class="weight-toggle" onclick="toggleWeight(this)">
          <span>${wt} lbs</span>
          <span class="arrow">▶</span>
        </div>
        <div class="weight-body">${wrestlerTableHtml(rowsHtml)}</div>
      </div>`;
  }
  section.innerHTML = html;
}

function renderTeams(data, preTourneyTeams) {
  const section = document.getElementById('teams-section');
  const wrestlers = data.wrestlers || {};
  const proj = data.current_projection || {};

  const teamColorMap = {};
  Object.entries(proj).sort((a, b) => b[1] - a[1]).slice(0, 10).forEach(([team], i) => {
    teamColorMap[team] = TEAM_COLORS[i % TEAM_COLORS.length];
  });

  const teamMap = {};
  for (const wt of WEIGHTS) {
    const wtData = wrestlers[String(wt)];
    if (!wtData) continue;
    for (const [seed, info] of Object.entries(wtData)) {
      const w = {weight: wt, seed: parseInt(seed), ...info};
      if (!teamMap[w.team]) teamMap[w.team] = {team: w.team, projected: 0, actual: 0, wrestlers: []};
      teamMap[w.team].projected += w.projected_total || 0;
      teamMap[w.team].actual += w.actual || 0;
      teamMap[w.team].wrestlers.push(w);
    }
  }

  const teams = Object.values(teamMap).sort((a, b) => b.projected - a.projected);
  let html = '';
  teams.forEach((team, teamIdx) => {
    const td = fmtDelta(team.projected - (preTourneyTeams[team.team] || 0));
    const sortedWrestlers = team.wrestlers.slice().sort((a, b) => a.weight - b.weight);
    const rowsHtml = sortedWrestlers.map(r => wrestlerRowHtml(r, `${r.weight} lbs`)).join('');
    html += `
      <div class="weight-group">
        <div class="weight-toggle" onclick="toggleWeight(this)">
          <span><span style="color:var(--muted);font-size:12px;margin-right:8px">${teamIdx + 1}.</span><span style="font-weight:700">${esc(team.team)}</span></span>
          <span style="display:flex;align-items:center;gap:16px;font-size:13px">
            <span class="${td.cls}">Δ ${td.text}</span>
            <span>Proj <strong>${team.projected.toFixed(1)}</strong></span>
            <span style="color:var(--muted)">(actual: ${team.actual.toFixed(1)})</span>
            <span class="arrow">▶</span>
          </span>
        </div>
        <div class="weight-body">${wrestlerTableHtml(rowsHtml)}</div>
      </div>`;
  });
  section.innerHTML = html;
}

function renderMovers(data) {
  const wrestlers = data.wrestlers || {};
  const all = [];
  for (const [wt, wtData] of Object.entries(wrestlers)) {
    for (const [seed, info] of Object.entries(wtData)) {
      if (!info.name || info.name.startsWith('Seed ')) continue;
      if (info.initial_projected == null) continue;
      const delta = info.projected_total - info.initial_projected;
      all.push({name: info.name, team: info.team, delta, weight: parseInt(wt)});
    }
  }

  const gainers = all.filter(w => w.delta > 0.05).sort((a, b) => b.delta - a.delta).slice(0, 10);
  const losers  = all.filter(w => w.delta < -0.05).sort((a, b) => a.delta - b.delta).slice(0, 10);

  function rowHtml(w) {
    const d = fmtDelta(w.delta);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(45,49,71,0.4);font-size:12px;gap:6px">
      <div style="min-width:0;flex:1;overflow:hidden">
        <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.name)}</div>
        <div style="color:var(--muted);font-size:11px">${esc(w.team)} · ${w.weight}</div>
      </div>
      <div style="flex-shrink:0"><span class="${d.cls}">${d.text}</span></div>
    </div>`;
  }

  const noData = '<div style="color:var(--muted);font-size:12px;padding:4px 0">No data yet.</div>';
  document.getElementById('gainers-list').innerHTML = gainers.length ? gainers.map(rowHtml).join('') : noData;
  document.getElementById('losers-list').innerHTML  = losers.length  ? losers.map(rowHtml).join('')  : noData;
}

// ============================================================
// Helpers
// ============================================================
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleWeight(el) {
  el.classList.toggle('open');
  const body = el.nextElementSibling;
  body.classList.toggle('open');
}

// ============================================================
// Refresh loop
// ============================================================
function startCountdown() {
  secondsSinceRefresh = 0;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    secondsSinceRefresh++;
    const badge = document.getElementById('refresh-badge');
    const left = Math.max(0, Math.round(REFRESH_MS / 1000) - secondsSinceRefresh);
    badge.textContent = `Next refresh in ${left}s`;
    badge.className = secondsSinceRefresh < 10 ? 'refresh-badge fresh' : 'refresh-badge';
  }, 1000);
}

async function loadAndRender() {
  const data = await fetchData();
  if (!data) {
    document.getElementById('loading').innerHTML =
      `<div class="error">Could not load data for ${selectedYear}.</div>`;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('content').style.display = 'none';
    return;
  }
  liveData = data;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  renderAll(data);
  if (selectedYear === LIVE_YEAR) startCountdown();
}

// Startup
initYearSelect();
loadAndRender();
if (selectedYear === LIVE_YEAR) {
  refreshTimer = setInterval(loadAndRender, REFRESH_MS);
  startCountdown();
} else {
  document.getElementById('refresh-badge').textContent = `${selectedYear} replay`;
}
</script>
