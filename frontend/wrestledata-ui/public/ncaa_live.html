<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCAA Wrestling — Live Prediction Leaderboard v2</title>
<link rel="stylesheet" href="/styles.css?v=20260904" />
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  /* Local token names kept as-is (this page predates the site's shared
     styles.css token system) -- only the values changed, to the same
     light/cream palette as the rest of MatSavant. */
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e7e1d5;
    --text: #211c16;
    --muted: #6b6153;
    --accent: #2b6cb0;
    --green: #38a169;
    --red: #c53030;
    --amber: #ed8936;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.5; }

  /* ── Header ── */
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .header-right { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--muted); }
  .header-right strong { color: var(--text); }
  .year-select {
    background: var(--border); color: var(--text); border: 1px solid var(--accent);
    border-radius: 6px; padding: 5px 10px; font-size: 14px; font-weight: 600; cursor: pointer; outline: none;
  }
  .year-select option { background: var(--card); }
  .refresh-badge { font-size: 12px; background: var(--border); border-radius: 6px; padding: 4px 10px; color: var(--muted); }
  .refresh-badge.fresh { color: var(--green); }

  main { max-width: 1440px; margin: 0 auto; padding: 20px 16px; }

  /* ── Hero row: leaderboard + chart ── */
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; align-items: start; }
  @media (max-width: 960px) { .hero { grid-template-columns: 1fr; } }
  .chart-card { position: sticky; top: 12px; align-self: start; }

  /* ── Card ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .card-header .sub { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: auto; }

  /* ── Team Leaderboard ── */
  .team-lb-table { width: 100%; border-collapse: collapse; }
  .team-lb-table th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 8px 14px; border-bottom: 1px solid var(--border); text-align: left; }
  .team-lb-table th.r { text-align: right; }
  .team-row td { padding: 0; border-bottom: 1px solid rgba(231,225,213,.5); }
  .team-row-inner {
    display: flex; align-items: center; padding: 9px 14px; cursor: pointer;
    transition: background .15s; gap: 10px; user-select: none;
  }
  .team-row-inner:hover { background: rgba(92,107,192,.08); }
  .team-rank { font-size: 13px; font-weight: 700; color: var(--muted); width: 22px; flex-shrink: 0; }
  .team-rank.gold { color: #ffd54f; }
  .team-rank.silver { color: #b0bec5; }
  .team-rank.bronze { color: #ff8a65; }
  .team-name-col { flex: 1; min-width: 0; }
  .team-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team-penalty { font-size: 11px; color: var(--red); }
  .team-orig   { font-size: 12px; color: var(--muted); width: 46px; text-align: right; flex-shrink: 0; }
  .team-proj   { font-size: 15px; font-weight: 800; width: 52px; text-align: right; flex-shrink: 0; }
  .team-delta  { font-size: 12px; font-weight: 600; width: 46px; text-align: right; flex-shrink: 0; }
  .team-actual { font-size: 12px; color: var(--muted); width: 46px; text-align: right; flex-shrink: 0; }
  .team-aa-pct { font-size: 11px; color: var(--muted); width: 36px; text-align: right; flex-shrink: 0; }
  .team-active { font-size: 11px; color: var(--muted); width: 32px; text-align: right; flex-shrink: 0; }
  .expand-arrow { font-size: 10px; color: var(--muted); width: 14px; flex-shrink: 0; transition: transform .2s; }
  .team-row.open .expand-arrow { transform: rotate(90deg); }

  /* wrestler expansion panel */
  .team-expand { display: none; background: rgba(33,28,22,.04); border-top: 1px solid var(--border); }
  .team-row.open .team-expand { display: block; }
  .expand-team-header { padding: 8px 14px; font-size: 11px; color: var(--muted); border-bottom: 1px solid rgba(231,225,213,.4); }
  .wrestler-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
  .wrestler-cell {
    padding: 11px 14px; border-right: 1px solid rgba(231,225,213,.3);
    border-bottom: 1px solid rgba(231,225,213,.3);
    font-size: 12px;
  }
  .wrestler-cell:nth-child(2n) { border-right: none; }
  .wrestler-cell.elim { opacity: .45; }
  .wc-header { display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px; }
  .wc-seed {
    font-size: 13px; font-weight: 800; flex-shrink: 0; color: var(--muted);
  }
  .wc-seed.s1 { color: #ffd54f; } .wc-seed.s2 { color: #b0bec5; } .wc-seed.s3 { color: #ff8a65; }
  .wc-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wc-sub  { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .wc-stats { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .wc-proj-val { font-weight: 700; font-size: 13px; color: var(--text); }

  /* show-all row */
  .show-all-row td { padding: 10px 14px; text-align: center; }
  .show-all-btn {
    background: none; border: 1px solid var(--border); color: var(--accent);
    border-radius: 6px; padding: 5px 16px; font-size: 12px; cursor: pointer;
    transition: background .15s;
  }
  .show-all-btn:hover { background: rgba(92,107,192,.1); }

  /* ── Tabs ── */
  .tabs-section { margin-top: 4px; }
  .tab-bar {
    display: flex; gap: 2px; border-bottom: 1px solid var(--border);
    background: var(--card); border-radius: 10px 10px 0 0;
    overflow: hidden; border: 1px solid var(--border);
  }
  .tab-btn {
    background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600;
    padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-count { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .tab-panel { display: none; background: var(--card); border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; }
  .tab-panel.active { display: block; }

  /* Big Moments (reused from v1) */
  .moment-card { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(231,225,213,.5); align-items: flex-start; }
  .moment-card:last-child { border-bottom: none; }
  .moment-tag { font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; letter-spacing: .04em; }
  .tag-upset  { background:rgba(255,152,0,.18); color:#ffb74d; border:1px solid rgba(255,152,0,.3); }
  .tag-bonus  { background:rgba(76,175,80,.18);  color:#81c784; border:1px solid rgba(76,175,80,.3); }
  .tag-both   { background:rgba(156,39,176,.18); color:#ce93d8; border:1px solid rgba(156,39,176,.3); }
  .tag-none   { background:rgba(92,107,192,.18); color:#9fa8da; border:1px solid rgba(92,107,192,.3); }
  .tag-lb     { background:rgba(3,169,244,.18);  color:#4fc3f7; border:1px solid rgba(3,169,244,.3); }
  .tag-usc    { background:rgba(244,67,54,.18);  color:#ef5350; border:1px solid rgba(244,67,54,.3); }
  .moment-body { flex:1; min-width:0; }
  .moment-meta  { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .moment-match { font-weight:600; font-size:13px; margin-bottom:4px; }
  .moment-impacts { font-size:12px; }
  .imp-pos { color:var(--green); font-weight:600; }
  .imp-neg { color:var(--red);   font-weight:600; }
  .moment-changes { display:flex; flex-direction:column; gap:3px; }
  .lb-change { font-size:13px; font-weight:600; }

  /* Movers */
  .movers-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .movers-col { padding: 14px 16px; }
  .movers-col:first-child { border-right: 1px solid var(--border); }
  .movers-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .mover-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(231,225,213,.4); font-size: 12px; gap: 6px; }
  .mover-row:last-child { border-bottom: none; }
  .delta-pos { color: var(--green); font-weight: 700; }
  .delta-neg { color: var(--red);   font-weight: 700; }
  .delta-neu { color: var(--muted); }

  /* By Weight */
  .weights-tab-inner { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .weight-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .weight-card-header { padding: 8px 12px; background: rgba(92,107,192,.1); border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; }
  .weight-card-header:hover { background: rgba(92,107,192,.18); }
  .weight-card-body { display: none; }
  .weight-card.open .weight-card-body { display: block; }
  .wrestler-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .wrestler-table th { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; padding: 5px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .wrestler-table th.r { text-align: right; }
  .wrestler-table td { padding: 6px 10px; border-bottom: 1px solid rgba(231,225,213,.3); }
  .wrestler-table td.r { text-align: right; }
  .wrestler-table tr.eliminated { opacity: .4; }
  .wrestler-table tr:last-child td { border-bottom: none; }
  .seed-badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 1px 5px; margin-right: 5px; background: rgba(92,107,192,.25); color: #9fa8da; }
  .seed-1 { background: rgba(255,213,79,.25); color: #ffd54f; }
  .seed-2 { background: rgba(176,190,197,.2); color: #b0bec5; }
  .seed-3 { background: rgba(255,138,101,.2); color: #ff8a65; }
  .aa-bar { display: inline-block; height: 4px; background: var(--accent); opacity: .5; border-radius: 2px; vertical-align: middle; margin-left: 4px; }

  /* Lazarus (reused from v1) */
  .lazarus-desc { font-size:12px; color:var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .lazarus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; padding: 12px 16px; }
  .lazarus-card { border-radius: 7px; border: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .lazarus-card.winner  { border-color: #ffd54f; background: rgba(255,213,79,.07); }
  .lazarus-card.alive   { border-color: var(--green); background: rgba(76,175,80,.07); }
  .lazarus-card.out     { opacity: .45; }
  .lazarus-seed { font-size: 18px; font-weight: 800; width: 32px; text-align: center; flex-shrink: 0; color: var(--muted); }
  .lazarus-card.winner .lazarus-seed { color: #ffd54f; }
  .lazarus-card.alive  .lazarus-seed { color: var(--green); }
  .lazarus-info { flex: 1; min-width: 0; }
  .lazarus-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lazarus-sub  { font-size: 11px; color: var(--muted); }
  .lazarus-badge { flex-shrink: 0; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 3px 7px; }
  .badge-winner { background: rgba(255,213,79,.2); color: #ffd54f; }
  .badge-alive  { background: rgba(76,175,80,.2);  color: var(--green); }
  .badge-place  { background: rgba(92,107,192,.2); color: #7986cb; }
  .badge-out    { background: rgba(123,127,158,.15); color: var(--muted); }

  .loading { padding: 60px; text-align: center; color: var(--muted); font-size: 16px; }
  .error   { color: var(--red); }
</style>
</head>
<body>
<script src="/header.js?v=20260903"></script>
<header>
  <h1>NCAA Wrestling <span>Live Prediction Leaderboard</span></h1>
  <div class="header-right">
    <select class="year-select" id="year-select" onchange="onYearChange(this.value)"></select>
    <div>Matches: <strong id="matches-stat">—</strong></div>
    <div class="refresh-badge" id="refresh-badge">Refreshing every 120s</div>
  </div>
</header>

<main>
  <div id="loading" class="loading">Loading tournament data...</div>
  <div id="content" style="display:none">

    <!-- Hero: leaderboard + chart -->
    <div class="hero">
      <div class="card" id="lb-card">
        <div class="card-header">
          Team Leaderboard
          <span class="sub" id="lb-sub"></span>
        </div>
        <table class="team-lb-table">
          <thead>
            <tr>
              <th colspan="2">Team</th>
              <th class="r">Orig</th>
              <th class="r">Proj</th>
              <th class="r">Δ</th>
              <th class="r">Actual</th>
              <th class="r">AA%</th>
              <th class="r">AA</th>
              <th style="width:14px"></th>
            </tr>
          </thead>
          <tbody id="lb-tbody"></tbody>
        </table>
      </div>

      <div class="card chart-card">
        <div class="card-header">Projection History <span class="sub">Top 10 teams</span></div>
        <div id="chart-div" style="height:440px"></div>
      </div>
    </div>

    <!-- Tabs: Moments | Movers | By Weight | Lazarus -->
    <div class="tabs-section">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('moments')">Big Moments <span class="tab-count" id="tab-moments-count"></span></button>
        <button class="tab-btn" onclick="switchTab('movers')">Wrestler Movers</button>
        <button class="tab-btn" onclick="switchTab('weights')">By Weight</button>
        <button class="tab-btn" onclick="switchTab('lazarus')">Lazarus Award <span class="tab-count" id="tab-lazarus-label"></span></button>
      </div>

      <div class="tab-panel active" id="tab-moments">
        <div id="moments-feed" style="max-height:500px;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:6px"></div>
      </div>

      <div class="tab-panel" id="tab-movers">
        <div class="movers-grid">
          <div class="movers-col">
            <div class="movers-label" style="color:var(--green)">Top Gainers</div>
            <div id="gainers-list"></div>
          </div>
          <div class="movers-col">
            <div class="movers-label" style="color:var(--red)">Top Losers</div>
            <div id="losers-list"></div>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-weights">
        <div class="weights-tab-inner" id="weights-grid"></div>
      </div>

      <div class="tab-panel" id="tab-lazarus">
        <div class="lazarus-desc" id="lazarus-desc"></div>
        <div class="lazarus-grid" id="lazarus-grid"></div>
      </div>
    </div>

  </div>
</main>

<script>
const LIVE_YEAR = 2027;
const YEARS = [2026, 2025, 2024, 2023, 2022, 2021, 2019];
const REFRESH_MS = 120_000;
const WEIGHTS = [125, 133, 141, 149, 157, 165, 174, 184, 197, 285];
const TEAM_COLORS = ['#2b6cb0','#e91e63','#00bcd4','#ff9800','#4caf50','#9c27b0','#f44336','#03a9f4','#8bc34a','#ff5722'];
const BONUS_RESULT_TYPES = new Set(['Fall','TF','MD','Forfeit','DQ','Inj.']);

let selectedYear = YEARS[0];
let refreshTimer = null, countdownTimer = null, secondsSinceRefresh = 0;
let showAllTeams = false;
let activeTab = 'moments';

const IS_LOCAL = window.location.protocol === 'file:' ||
  window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const LOCAL_ROOT = IS_LOCAL ? '../../../' : '';
const LIVE_DATA_URL = IS_LOCAL
  ? LOCAL_ROOT + 'live_data.json'
  : 'https://wrestledata-simple-production.up.railway.app/live_data.json';

function dataUrlForYear(year) {
  if (year === LIVE_YEAR && !IS_LOCAL) return LIVE_DATA_URL;
  return `${LOCAL_ROOT}data/${year}/simulation_replay.json`;
}

// ── Year select ────────────────────────────────────────────
function initYearSelect() {
  const sel = document.getElementById('year-select');
  YEARS.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y === LIVE_YEAR ? `${y} ▶ LIVE` : String(y);
    if (y === selectedYear) opt.selected = true;
    sel.appendChild(opt);
  });
}

function onYearChange(year) {
  selectedYear = parseInt(year);
  showAllTeams = false;
  clearInterval(refreshTimer); clearInterval(countdownTimer);
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  loadAndRender();
  if (selectedYear === LIVE_YEAR) {
    refreshTimer = setInterval(loadAndRender, REFRESH_MS);
    startCountdown();
  } else {
    document.getElementById('refresh-badge').textContent = `${year} replay`;
    document.getElementById('refresh-badge').className = 'refresh-badge';
  }
}

// ── Tabs ───────────────────────────────────────────────────
function switchTab(name) {
  activeTab = name;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── Data ───────────────────────────────────────────────────
async function fetchData() {
  try {
    const resp = await fetch(dataUrlForYear(selectedYear) + '?_=' + Date.now());
    if (!resp.ok) throw new Error(resp.statusText);
    return await resp.json();
  } catch(e) { console.error('Fetch error:', e); return null; }
}

// ── Shared helpers ─────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDelta(d) {
  if (Math.abs(d) < 0.05) return {text:'—', cls:'delta-neu'};
  return d > 0 ? {text:`+${d.toFixed(1)}`, cls:'delta-pos'} : {text:d.toFixed(1), cls:'delta-neg'};
}
function buildTeamRanks(data) {
  const proj = data.current_projection || {};
  const pre  = data.pre_tourney_predictions || {};
  const wrestlers = data.wrestlers || {};
  const teamStats = {};
  for (const [wt, wtData] of Object.entries(wrestlers)) {
    for (const w of Object.values(wtData)) {
      if (!w.team) continue;
      if (!teamStats[w.team]) teamStats[w.team] = {active:0, actual:0, aa_sum:0, aa_count:0};
      const s = teamStats[w.team];
      if (w.alive) s.active++;
      s.actual += w.actual || 0;
      if (w.aa_prob != null) { s.aa_sum += w.aa_prob; s.aa_count++; }
    }
  }
  const teams = Object.keys(proj);
  teams.sort((a, b) => (proj[b] || 0) - (proj[a] || 0));
  return teams.map((team, i) => {
    const s = teamStats[team] || {};
    return {
      rank: i + 1, team,
      proj: proj[team] || 0,
      pre: pre[team] || 0,
      actual: s.actual || 0,
      active: s.active || 0,
      aa_pct: s.aa_count > 0 ? Math.round((s.aa_sum / s.aa_count) * 100) : 0,
      aa_alive: s.active || 0,
    };
  });
}

// ── Expandable team leaderboard ────────────────────────────
function renderLeaderboard(data, teamRanks) {
  const wrestlers = data.wrestlers || {};
  const penalties = data.team_penalties || {};
  const SHOW_N = 10;

  // Build wrestler list per team
  const byTeam = {};
  for (const [wt, wtData] of Object.entries(wrestlers)) {
    for (const [seed, w] of Object.entries(wtData)) {
      if (!w.name || w.name.startsWith('Seed ')) continue;
      if (!byTeam[w.team]) byTeam[w.team] = [];
      byTeam[w.team].push({...w, weight: parseInt(wt), seed: parseInt(seed)});
    }
  }
  for (const ws of Object.values(byTeam)) {
    ws.sort((a, b) => a.weight - b.weight);
  }

  const visible = showAllTeams ? teamRanks : teamRanks.slice(0, SHOW_N);
  document.getElementById('lb-sub').textContent =
    showAllTeams ? `${teamRanks.length} teams` : `Showing top ${SHOW_N} of ${teamRanks.length}`;

  const rankColor = r => r === 1 ? 'gold' : r === 2 ? 'silver' : r === 3 ? 'bronze' : '';

  const rows = visible.map(r => {
    const d = fmtDelta(r.proj - r.pre);
    const pen = penalties[r.team];
    const penStr = pen ? `${pen > 0 ? '+' : ''}${pen.toFixed(1)} USC penalty` : '';
    const ws = byTeam[r.team] || [];
    const wrestlerCells = ws.map(w => {
      const sc = w.seed <= 3 ? `s${w.seed}` : '';
      const elim = w.alive ? '' : ' elim';
      const wd = w.initial_projected != null ? fmtDelta(w.projected_total - w.initial_projected) : {text:'—',cls:'delta-neu'};
      const aaPct = w.aa_prob != null ? Math.round(w.aa_prob * 100) + '%' : '—';
      const origStr = w.initial_projected != null ? w.initial_projected.toFixed(1) : '—';
      return `<div class="wrestler-cell${elim}">
        <div class="wc-header">
          <span class="wc-seed ${sc}">${w.seed}</span>
          <span class="wc-name">${esc(w.name)}</span>
        </div>
        <div class="wc-sub">${w.weight} lbs${w.alive ? '' : ' · eliminated'}</div>
        <div class="wc-stats">
          <span><span class="wc-proj-val">${w.projected_total.toFixed(1)}</span> proj (was ${origStr})</span>
          <span class="${wd.cls}">${wd.text}</span>
          <span>${w.actual.toFixed(1)} actual</span>
          <span>${aaPct} AA</span>
        </div>
      </div>`;
    }).join('');

    const expandHeader = penStr
      ? `<div class="expand-team-header"><span class="team-penalty">${penStr}</span></div>`
      : '';

    return `<tr class="team-row" id="tr-${r.rank}">
      <td colspan="9" style="padding:0">
        <div class="team-row-inner" onclick="toggleTeamRow(${r.rank})">
          <div class="team-rank ${rankColor(r.rank)}">${r.rank}</div>
          <div class="team-name-col">
            <div class="team-name">${esc(r.team)}</div>
          </div>
          <div class="team-orig">${r.pre.toFixed(1)}</div>
          <div class="team-proj">${r.proj.toFixed(1)}</div>
          <div class="team-delta"><span class="${d.cls}">${d.text}</span></div>
          <div class="team-actual">${r.actual.toFixed(1)}</div>
          <div class="team-aa-pct">${r.aa_pct}%</div>
          <div class="team-active">${r.active > 0 ? `<span style="color:var(--green)">${r.active}✓</span>` : '—'}</div>
          <div class="expand-arrow">▶</div>
        </div>
        <div class="team-expand">
          ${expandHeader}
          <div class="wrestler-grid">${wrestlerCells || '<div style="padding:12px 16px;color:var(--muted);font-size:12px">No wrestler data.</div>'}</div>
        </div>
      </td>
    </tr>`;
  }).join('');

  // Show-all row
  const showAllRow = !showAllTeams ? `<tr class="show-all-row">
    <td colspan="9">
      <button class="show-all-btn" onclick="expandAllTeams()">
        Show all ${teamRanks.length} teams ▾
      </button>
    </td>
  </tr>` : '';

  const collapseRow = showAllTeams ? `<tr class="show-all-row">
    <td colspan="9">
      <button class="show-all-btn" onclick="collapseTeams()">
        Show top 10 only ▴
      </button>
    </td>
  </tr>` : '';

  document.getElementById('lb-tbody').innerHTML = collapseRow + rows + showAllRow;
}

function toggleTeamRow(rank) {
  const row = document.getElementById('tr-' + rank);
  if (row) row.classList.toggle('open');
}

function expandAllTeams() {
  showAllTeams = true;
  if (window._lastData) renderLeaderboard(window._lastData, buildTeamRanks(window._lastData));
}

function collapseTeams() {
  showAllTeams = false;
  if (window._lastData) renderLeaderboard(window._lastData, buildTeamRanks(window._lastData));
  document.getElementById('lb-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Match chart height to collapsed leaderboard height
function resizeChartToLeaderboard() {
  if (showAllTeams) return;
  requestAnimationFrame(() => {
    const lbCard = document.getElementById('lb-card');
    const chartDiv = document.getElementById('chart-div');
    const chartHeader = document.querySelector('.chart-card .card-header');
    if (!lbCard || !chartDiv) return;
    const headerH = chartHeader ? chartHeader.offsetHeight : 44;
    const target = Math.max(300, lbCard.offsetHeight - headerH);
    chartDiv.style.height = target + 'px';
    if (window.Plotly) Plotly.Plots.resize('chart-div');
  });
}

// ── Chart (same logic as v1) ───────────────────────────────
function renderChart(data, teamRanks) {
  const history = data.history || [];
  const sortedMatches = data.sorted_matches || [];
  const top10teams = teamRanks.slice(0, 10).map(r => r.team);

  const sessionStarts = {};
  history.forEach(h => { if (!sessionStarts[h.round]) sessionStarts[h.round] = h.match_n; });
  const lastCompleted = history.reduce((mx, h) => Math.max(mx, h.match_n), 0);

  const s2 = sessionStarts['R16'] || lastCompleted;
  const s3 = sessionStarts['QF']  || lastCompleted;
  const s4 = sessionStarts['SF']  || lastCompleted;
  const s5 = lastCompleted + 1;
  const s6 = s5 + 40; const s7 = s6 + 10; const maxMatch = s7 + 5;

  const sessions = [
    {name:'R32 + Consi 1', start:0,  end:s2-1, completed:true},
    {name:'R16 + Consi 2', start:s2, end:s3-1, completed:true},
    {name:'QF + Consi 3/4',start:s3, end:s4-1, completed:true},
    {name:'SF + Consi QF', start:s4, end:s5-1, completed:true},
    {name:'Consi SF + Medals',start:s5,end:s6-1,completed:false},
    {name:'Finals',        start:s6, end:s7,   completed:false},
  ];

  function matchLabel(m) {
    if (!m) return '';
    const score = m.score || '';
    const method = score ? m.result_type + ' ' + score : m.result_type;
    return m.winner_name + ' def. ' + m.loser_name + ' (' + method + ') — ' + m.weight + 'lb';
  }

  const traces = top10teams.map((team, i) => {
    const x = [], y = [], cd = [];
    let prevProj = null;
    history.forEach(h => {
      if (!h.projections || h.projections[team] == null) return;
      const mn = h.match_n, proj = h.projections[team];
      if (prevProj === null) {
        x.push(mn); y.push(proj); cd.push(['Pre-tournament projection', proj, '']);
        prevProj = proj; return;
      }
      const delta = proj - prevProj; prevProj = proj;
      if (Math.abs(delta) < 0.05) return;
      const label = h.match ? matchLabel(h.match) : (sortedMatches[mn-1] ? matchLabel(sortedMatches[mn-1]) : 'Match #'+mn);
      const deltaStr = (delta > 0 ? '+' : '') + delta.toFixed(1);
      x.push(mn); y.push(proj); cd.push([label, proj, deltaStr]);
    });
    return {
      x, y, name: team, mode: 'lines',
      line: {color: TEAM_COLORS[i % TEAM_COLORS.length], width: 2, shape: 'hv'},
      customdata: cd, showlegend: false,
      hovertemplate: '<b>%{fullData.name}</b><br>%{customdata[0]}<br>Proj: %{customdata[1]:.1f}  %{customdata[2]}<extra></extra>',
    };
  });

  const lastProj = {};
  top10teams.forEach(team => {
    const entries = history.filter(h => h.projections && h.projections[team] != null);
    if (entries.length) lastProj[team] = entries[entries.length-1].projections[team];
  });
  const allVals = history.flatMap(h => Object.values(h.projections || {}));
  const yRange = Math.max(...allVals) - Math.min(...allVals);
  const minSpacing = yRange * (11/370);
  const labels = top10teams.map((team,i) => ({team, y: lastProj[team]||0, color: TEAM_COLORS[i]})).sort((a,b) => b.y-a.y);
  for (let i=1;i<labels.length;i++) { if (labels[i-1].y - labels[i].y < minSpacing) labels[i].y = labels[i-1].y - minSpacing; }
  const labelAnnotations = labels.map(lbl => ({
    xref:'x', yref:'y', x: lastCompleted+2, y: lbl.y,
    text: lbl.team, showarrow: false, font:{size:10, color:lbl.color},
    xanchor:'left', yanchor:'middle',
  }));

  const shapes=[], annotations=[...labelAnnotations];
  const minWide = maxMatch*0.12;
  sessions.forEach((s,i) => {
    const width = Math.min(s.end, maxMatch) - s.start;
    const labelColor = s.completed ? '#6b6153' : '#8f8574';
    shapes.push({type:'rect',xref:'x',yref:'paper',x0:s.start,x1:s.end,y0:0,y1:1,fillcolor:i%2===0?'rgba(33,28,22,0.03)':'rgba(0,0,0,0)',line:{width:0}});
    if (i>0) shapes.push({type:'line',xref:'x',yref:'paper',x0:s.start,x1:s.start,y0:0,y1:1,line:{color:'rgba(255,255,255,0.15)',width:1,dash:'dot'}});
    if (width >= minWide) annotations.push({xref:'x',yref:'paper',x:(s.start+Math.min(s.end,maxMatch))/2,y:1.02,text:s.name,showarrow:false,font:{size:10,color:labelColor},xanchor:'center',yanchor:'bottom'});
    else annotations.push({xref:'x',yref:'paper',x:s.start+1,y:1.0,text:s.name+(s.completed?'':' <i>(upcoming)</i>'),showarrow:false,font:{size:9,color:labelColor},xanchor:'left',yanchor:'bottom',textangle:-40});
  });

  Plotly.react('chart-div', traces, {
    paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
    font:{color:'#6b6153',size:11},
    xaxis:{range:[0,maxMatch],gridcolor:'#e7e1d5',color:'#6b6153',showticklabels:false},
    yaxis:{gridcolor:'#e7e1d5',color:'#6b6153'},
    margin:{l:50,r:110,t:30,b:20},
    hovermode:'closest', shapes, annotations,
  }, {responsive:true, displayModeBar:false});
}

// ── Big Moments ────────────────────────────────────────────
function renderMoments(data) {
  const moments = data.moments || [];
  const btns = document.querySelectorAll('.tab-btn');
  // update count badge on tab
  document.getElementById('tab-moments-count').textContent = moments.length ? `(${moments.length})` : '';

  const display = moments.slice().reverse().slice(0, 50);
  document.getElementById('moments-feed').innerHTML = display.length
    ? display.map(m => {
        if (m.type === 'penalty') return `<div class="moment-card"><div class="moment-tag tag-usc">USC</div><div class="moment-body"><div class="moment-meta">Unsportsmanlike Conduct Penalty</div><div class="moment-match"><b>${esc(m.team)}</b> — <span class="imp-neg">${m.delta.toFixed(1)} pts</span> (total: ${m.total.toFixed(1)})</div></div></div>`;
        if (m.type === 'leaderboard') return `<div class="moment-card"><div class="moment-tag tag-lb">STANDINGS</div><div class="moment-body"><div class="moment-meta">${esc(m.round_label)} · Match #${m.match_n}</div><div class="moment-changes">${(m.changes||[]).map(c=>`<div class="lb-change">${esc(c)}</div>`).join('')}</div></div></div>`;
        let tagCls='tag-none', tagText='—';
        if (m.tag==='UPSET+BONUS'){tagCls='tag-both';tagText='UPSET+BONUS';}
        else if(m.tag==='UPSET'){tagCls='tag-upset';tagText='UPSET';}
        else if(m.tag==='BONUS'){tagCls='tag-bonus';tagText='BONUS';}
        const impHtml = Object.entries(m.impacts||{}).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([t,d])=>`<span class="${d>0?'imp-pos':'imp-neg'}">${d>0?'+':''}${d.toFixed(1)}</span> ${esc(t)}`).join(' &nbsp;·&nbsp; ');
        return `<div class="moment-card"><div class="moment-tag ${tagCls}">${tagText}</div><div class="moment-body"><div class="moment-meta">${esc(m.round_label)} · ${m.weight} lbs · Match #${m.match_n}</div><div class="moment-match"><b>#${m.winner_seed} ${esc(m.winner_name)}</b> (${esc(m.winner_team)}) def. <b>#${m.loser_seed} ${esc(m.loser_name)}</b> (${esc(m.loser_team)}) · ${esc(m.result_type)}</div>${impHtml?`<div class="moment-impacts">${impHtml}</div>`:''}</div></div>`;
      }).join('')
    : '<div style="color:var(--muted);font-size:12px;padding:8px 0">No big moments yet.</div>';
}

// ── Movers ─────────────────────────────────────────────────
function renderMovers(data) {
  const wrestlers = data.wrestlers || {};
  const all = [];
  for (const [wt, wtData] of Object.entries(wrestlers)) {
    for (const [seed, info] of Object.entries(wtData)) {
      if (!info.name || info.name.startsWith('Seed ') || info.initial_projected == null) continue;
      all.push({name:info.name, team:info.team, delta:info.projected_total - info.initial_projected, weight:parseInt(wt)});
    }
  }
  const gainers = all.filter(w=>w.delta>0.05).sort((a,b)=>b.delta-a.delta).slice(0,10);
  const losers  = all.filter(w=>w.delta<-0.05).sort((a,b)=>a.delta-b.delta).slice(0,10);
  function rowHtml(w) {
    const d = fmtDelta(w.delta);
    return `<div class="mover-row"><div style="min-width:0;flex:1"><div style="font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.name)}</div><div style="color:var(--muted);font-size:11px">${esc(w.team)} · ${w.weight}</div></div><span class="${d.cls}">${d.text}</span></div>`;
  }
  const none = '<div style="color:var(--muted);font-size:12px;padding:4px 0">No data yet.</div>';
  document.getElementById('gainers-list').innerHTML = gainers.length ? gainers.map(rowHtml).join('') : none;
  document.getElementById('losers-list').innerHTML  = losers.length  ? losers.map(rowHtml).join('') : none;
}

// ── By Weight ──────────────────────────────────────────────
function renderWeights(data, teamRanks) {
  const wrestlers = data.wrestlers || {};
  const teamRankMap = {};
  teamRanks.forEach((r,i) => teamRankMap[r.team] = i+1);

  const grid = WEIGHTS.map(wt => {
    const wtData = wrestlers[String(wt)] || {};
    const rows = Object.entries(wtData)
      .map(([seed, w]) => ({...w, seed:parseInt(seed)}))
      .sort((a,b) => b.projected_total - a.projected_total);
    const rowsHtml = rows.map(w => {
      const sc = w.seed<=3 ? `seed-${w.seed}` : '';
      const aaPct = Math.round((w.aa_prob||0)*100);
      const d = w.initial_projected != null ? fmtDelta(w.projected_total - w.initial_projected) : {text:'—',cls:'delta-neu'};
      return `<tr class="${w.alive?'':'eliminated'}">
        <td><span class="seed-badge ${sc}">${w.seed}</span><strong>${esc(w.name)}</strong><br>
          <span style="font-size:11px;color:var(--muted);padding-left:28px">${esc(w.team)}</span></td>
        <td class="r"><span class="${d.cls}">${d.text}</span></td>
        <td class="r"><strong>${w.projected_total.toFixed(1)}</strong></td>
        <td class="r" style="opacity:.6">${w.actual.toFixed(1)}</td>
        <td class="r">${aaPct}%<span class="aa-bar" style="width:${Math.min(40,aaPct*.4)}px"></span></td>
      </tr>`;
    }).join('');
    return `<div class="weight-card">
      <div class="weight-card-header" onclick="this.parentElement.classList.toggle('open')">${wt} lbs ▸</div>
      <div class="weight-card-body">
        <table class="wrestler-table">
          <thead><tr><th>Wrestler</th><th class="r">Δ</th><th class="r">Proj</th><th class="r">Actual</th><th class="r">AA%</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
  document.getElementById('weights-grid').innerHTML = grid;
}

// ── Lazarus (same logic as v1) ─────────────────────────────
function renderLazarus(data) {
  const matches = data.sorted_matches || [];
  const ROUND_LABEL = {'C_PIG':'Consi 1','C_R1':'Consi 1','C_R2':'Consi 2','C_R3':'Consi 3','C_R4':'Consi 4','C_QF':'Consi QF','C_SF':'Consi SF','3rd':'3rd match'};
  const ROUND_RANK  = {'C_PIG':0,'C_R1':0,'C_R2':1,'C_R3':2,'C_R4':3,'C_QF':4,'C_SF':5,'3rd':6};

  const r1LossMap = new Map();
  for (const m of matches) {
    if (m.round==='R32'||m.round==='PIG') {
      const key=`${m.loser_name}|${m.weight}`;
      r1LossMap.set(key,{seed:m.loser_seed,name:m.loser_name,team:m.loser_team,weight:m.weight,lostTo:`#${m.winner_seed} ${m.winner_name}`});
    }
  }
  if (!r1LossMap.size) { document.getElementById('lazarus-desc').textContent='No data.'; return; }

  const placementMap = new Map();
  const PLACE_ROUNDS = {Final:[1,2],'3rd':[3,4],'5th':[5,6],'7th':[7,8]};
  for (const m of matches) { const p=PLACE_ROUNDS[m.round]; if(!p) continue; placementMap.set(`${m.winner_name}|${m.weight}`,p[0]); placementMap.set(`${m.loser_name}|${m.weight}`,p[1]); }

  const elimRoundRawMap = new Map();
  for (const m of matches) {
    if (m.round==='R32'||m.round==='PIG') continue;
    const key=`${m.loser_name}|${m.weight}`;
    if (r1LossMap.has(key)&&!elimRoundRawMap.has(key)) elimRoundRawMap.set(key,m.round);
  }

  const candidates=[];
  for (const [key,info] of r1LossMap.entries()) {
    const placement=placementMap.get(key)??null;
    const elimRoundRaw=elimRoundRawMap.get(key)??null;
    const elimRound=elimRoundRaw?(ROUND_LABEL[elimRoundRaw]||elimRoundRaw):null;
    const alive=!elimRoundRaw&&!placement;
    const advRank=placement===3?99:alive?98:(ROUND_RANK[elimRoundRaw]??-1);
    candidates.push({...info,placement,elimRound,alive,advRank});
  }
  candidates.sort((a,b)=>b.advRank-a.advRank||a.seed-b.seed||a.weight-b.weight);

  const winner=candidates.find(c=>c.placement===3)??null;
  const aliveCount=candidates.filter(c=>c.alive).length;
  const isWinner=c=>winner&&c.name===winner.name&&c.weight===winner.weight;

  // Update tab label
  if (winner) document.getElementById('tab-lazarus-label').textContent=`(Winner: #${winner.seed} ${winner.name})`;
  else if (aliveCount>0) document.getElementById('tab-lazarus-label').textContent=`(${aliveCount} alive)`;
  else document.getElementById('tab-lazarus-label').textContent='';

  let desc='Given to the highest-seeded wrestler who loses in the first round (R32/PIG) and comes back to finish 3rd place. No consolation prize — 3rd or nothing.';
  if (aliveCount>0) desc+=` ${aliveCount} candidate${aliveCount!==1?'s':''} still alive.`;
  document.getElementById('lazarus-desc').textContent=desc;

  function placeStr(p) { return p?p+({1:'st',2:'nd',3:'rd'}[p]||'th'):''; }

  document.getElementById('lazarus-grid').innerHTML=candidates.map(c=>{
    const isW=isWinner(c);
    const cardCls=isW?'winner':c.alive?'alive':'out';
    let badges='';
    if(isW) badges=`<div class="lazarus-badge badge-winner">🏆 3rd place</div>`;
    else if(c.alive) badges=`<div class="lazarus-badge badge-alive">Still alive</div>`;
    else {
      badges=`<div class="lazarus-badge badge-out">Elim. ${esc(c.elimRound||'—')}</div>`;
      if(c.placement&&c.placement!==3) badges+=` <div class="lazarus-badge badge-place">${placeStr(c.placement)}</div>`;
    }
    return `<div class="lazarus-card ${cardCls}">
      <div class="lazarus-seed">${c.seed}</div>
      <div class="lazarus-info"><div class="lazarus-name">${esc(c.name)}</div><div class="lazarus-sub">${esc(c.team)} · ${c.weight} lbs · Lost to ${esc(c.lostTo)}</div></div>
      <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">${badges}</div>
    </div>`;
  }).join('');
}

// ── Header ─────────────────────────────────────────────────
function renderHeader(data) {
  const total = data.matches_total || '—';
  const done  = data.matches_completed || 0;
  document.getElementById('matches-stat').textContent = `${done} / ${total}`;
}

// ── Main render ────────────────────────────────────────────
function renderAll(data) {
  window._lastData = data;
  renderHeader(data);
  const teamRanks = buildTeamRanks(data);
  renderLeaderboard(data, teamRanks);
  renderChart(data, teamRanks);
  renderMoments(data);
  renderMovers(data);
  renderWeights(data, teamRanks);
  renderLazarus(data);
  resizeChartToLeaderboard();
}

// ── Refresh loop ───────────────────────────────────────────
function startCountdown() {
  secondsSinceRefresh=0;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    secondsSinceRefresh++;
    const badge=document.getElementById('refresh-badge');
    const left=Math.max(0,Math.round(REFRESH_MS/1000)-secondsSinceRefresh);
    badge.textContent=`Next refresh in ${left}s`;
    badge.className=secondsSinceRefresh<10?'refresh-badge fresh':'refresh-badge';
  },1000);
}

async function loadAndRender() {
  const data = await fetchData();
  if (!data) {
    document.getElementById('loading').innerHTML=`<div class="error">Could not load data for ${selectedYear}.</div>`;
    document.getElementById('loading').style.display='block';
    document.getElementById('content').style.display='none';
    return;
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  renderAll(data);
  if (selectedYear===LIVE_YEAR) startCountdown();
}

initYearSelect();
loadAndRender();
if (selectedYear===LIVE_YEAR) {
  refreshTimer=setInterval(loadAndRender, REFRESH_MS);
  startCountdown();
} else {
  document.getElementById('refresh-badge').textContent=`${selectedYear} replay`;
}
</script>
