<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Freshman of the Year Watch — MatSavant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css?v=20260921" />
  <style>
    /* Same table language as the Rankings page (dpg-table / dpg-* classes in styles.css);
       fr- classes are only the bits this page adds. */
    #freshman-table th, #freshman-table td { text-align: left; vertical-align: middle; }
    #freshman-table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #freshman-table th.num { white-space: normal; }
    #freshman-table th, #freshman-table td { padding-left: 8px; padding-right: 8px; }
    #freshman-table .dpg-wrestler-name,
    #freshman-table .dpg-wrestler-sub,
    #freshman-table .dpg-team-name { white-space: nowrap; }
    #freshman-table .dpg-headshot { width: 48px; height: 48px; }
    #freshman-table .dpg-headshot--crest { padding: 6px; }
    #freshman-table .dpg-team-icon-slot { width: 40px; }
    #freshman-table .dpg-team-crest { height: 30px; max-width: 40px; }
    #freshman-table .dpg-meter-track { width: 76px; }
    #freshman-table th.fr-group { border-left: 1px solid var(--border); }
    #freshman-table td.fr-group { border-left: 1px solid var(--border); }

    #freshman-table .dpg-dpg-value { font-size: 1.45rem; }
    .fr-place { font-size: 1.05rem; font-weight: 700; color: var(--text); white-space: nowrap; }
    .fr-place-sub { font-size: 0.72rem; color: var(--muted-2); white-space: nowrap; margin-top: 1px; }
    .fr-place-dnp { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
    body.fr-no-ncaa .fr-ncaa-col { display: none; }
    .fr-muted { color: var(--muted); }
    .fr-strong { font-weight: 700; color: var(--text); }

    .fr-key {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 0 0 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .fr-key strong { color: var(--text); }

    .fr-mobile-right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      min-width: 56px;
    }
    .fr-mobile-place {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .fr-mobile-place strong { color: var(--text); }

    @media (max-width: 767px) {
      #freshman-table-wrapper { display: none; }
      #freshman-mobile-list { display: block; }
    }
  </style>
</head>
<body>
  <script src="/analytics.js?v=20260911"></script>
  <script src="/header.js?v=20260908"></script>
  <script src="/lab_stamp.js?v=20260910"></script>
  <div class="page-container">
    <header class="header">
      <h1>Freshman of the Year Watch</h1>
      <div class="header-subline" id="season-info"></div>
      <div class="header-explainer" id="description"></div>
    </header>

    <section class="section">
      <div class="fr-key">
        <span class="fr-ncaa-col"><strong>NCAAs</strong>: finish at the NCAA Championships, with seed and bout record</span>
      </div>
      <div class="table-wrapper" id="freshman-table-wrapper">
        <table id="freshman-table" class="dpg-table">
          <thead>
            <tr>
              <th style="width: 32px;">Rank</th>
              <th>Wrestler</th>
              <th>Team</th>
              <th title="Dual Points Gained. Your dual-point result (DEC 3, MD 4, TF 5, F 6) minus what a typical wrestler gets against that same opponent.">DPG ⓘ</th>
              <th class="fr-ncaa-col" title="NCAA Championships finish, with seed and NCAA bout record">NCAAs</th>
              <th class="fr-group">Record</th>
              <th class="num">Bonus %</th>
              <th class="num">Pin %</th>
              <th class="num fr-group" title="Wins over opponents ranked in the top 33">Ranked W</th>
              <th class="num" title="Wins over opponents ranked in the top 10">Top-10 W</th>
              <th class="num" title="Share of ranked wins that were bonus-point wins">Ranked Bonus %</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="dpg-mobile-list" id="freshman-mobile-list"></div>
    </section>
  </div>

  <script src="/mobile_rank_row.js?v=20260907"></script>
  <script src="/freshman.js?v=20261002b"></script>
</body>
</html>
