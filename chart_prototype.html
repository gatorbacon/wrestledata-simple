const sessions = [{"name": "R32 + Consi 1", "start": 0, "end": 260, "completed": true}, {"name": "R16 + Consi 2", "start": 261, "end": 420, "completed": true}, {"name": "QF + Consi 3/4", "start": 421, "end": 540, "completed": true}, {"name": "SF + Consi QF", "start": 541, "end": 580, "completed": true}, {"name": "Consi SF + Medals", "start": 581, "end": 620, "completed": false}, {"name": "Finals", "start": 621, "end": 631, "completed": false}];
const MAX_MATCH = 636;
const MIN_WIDE = 76.32;

const plotTraces = tracesData.map(t => ({
  x: t.x, y: t.y, name: t.team, mode: 'lines',
  line: { color: t.color, width: 2, shape: 'hv' },
  customdata: t.customdata,
  hovertemplate:
    '<b>%{fullData.name}</b><br>' +
    '%{customdata[0]}<br>' +
    '%{customdata[1]:.1f}' +
    '<extra></extra>'
}));

const shapes = [];
const annotations = [];

sessions.forEach((s, i) => {
  const width = Math.min(s.end, MAX_MATCH) - s.start;
  const isWide = width >= MIN_WIDE;
  const labelColor = s.completed ? '#bbb' : '#555';

  shapes.push({
    type:'rect', xref:'x', yref:'paper',
    x0:s.start, x1:s.end, y0:0, y1:1,
    fillcolor: i%2===0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0)',
    line:{width:0}
  });

  if (i > 0) {
    shapes.push({
      type:'line', xref:'x', yref:'paper',
      x0:s.start, x1:s.start, y0:0, y1:1,
      line:{color:'rgba(255,255,255,0.2)',width:1,dash:'dot'}
    });
  }

  if (isWide) {
    annotations.push({
      xref:'x', yref:'paper',
      x: (s.start + Math.min(s.end, MAX_MATCH)) / 2,
      y: 1.02,
      text: s.name,
      showarrow: false,
      font: {size:11, color:labelColor},
      xanchor:'center', yanchor:'bottom'
    });
  } else {
    annotations.push({
      xref:'x', yref:'paper',
      x: s.start + 1,
      y: 1.0,
      text: s.name + (s.completed ? '' : ' <i>(upcoming)</i>'),
      showarrow: false,
      font: {size:10, color:labelColor},
      xanchor:'left', yanchor:'bottom',
      textangle: -40
    });
  }
});

Plotly.newPlot('chart', plotTraces, {

}, {responsive:true});
