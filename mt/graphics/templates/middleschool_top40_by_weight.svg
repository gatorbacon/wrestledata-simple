<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1080" height="100" fill="url(#headerGradient)"/>
  <text x="540" y="45" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" inkscape:label="title">TOP 40 RANKED MIDDLE SCHOOLERS</text>
  <text x="540" y="75" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" inkscape:label="date">01.15.2026</text>
  <text x="540" y="95" font-family="Arial, sans-serif" font-size="14" fill="#ffd700" text-anchor="middle" inkscape:label="subtitle">KENTUCKY BOYS WRESTLING</text>
  
  <!-- Weight class sections with two columns each -->
  <g inkscape:label="weightSections">
    <!-- Weight class header template (will be populated dynamically) -->
    <!-- Each weight class will have a header and two columns of wrestlers -->
  </g>
  
  <!-- Footer -->
  <text x="540" y="1070" font-family="Arial, sans-serif" font-size="12" fill="#5a6c7d" text-anchor="middle" inkscape:label="footer">@ky.wrestling.ranks</text>
</svg>
