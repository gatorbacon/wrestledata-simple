}

function openFilter(){
	location.href = "RoundResults.jsp?TIM=1774212905867&twSessionId=aelwwujdey&displayResult=&roundId=null&groupId=null&fontSizeBox=10&displayFormatBox=&includeByesBox=Y&patternBox=1";
}

function viewSchedule(){
	try{
	
		var patternRegExp = /^\s*$|^\s*\d{1,3}\s*(,\s*\d{1,3}\s*)*$/;
		var patternBox = document.getElementById("patternBox");
		if(patternBox.value.search(patternRegExp)==-1){
			alert("Your page break pattern must be something like the following 2 or 1,2,4.");
			patternBox.focus();
			return;
		} 
	
		with(window.document.theForm){
			if(roundIdBox.value=="" && groupIdBox.value=="" && "viewer"!="admin"){
				alert("You must select either a round or a weight class.");
				roundIdBox.focus();
			}else{
				action = "RoundResults.jsp?TIM=1774212905867&twSessionId=aelwwujdey&displayResult=Y&roundId="+getMultipleSelectedValues("roundIdBox")+"&groupId="+getMultipleSelectedValues("groupIdBox");
				submit();
			}
		}
	}catch(error){
		alert("An error occurred and below is the error message.\n\n" + error.message);
	}
}
